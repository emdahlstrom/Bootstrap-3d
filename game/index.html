<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap 3D - Meadow Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; }
        canvas { display: block; width: 100vw; height: 100vh; }
        .info {
            position: fixed; top: 1rem; left: 50%; transform: translateX(-50%);
            color: #fff; font-family: sans-serif; font-size: 0.85rem;
            background: rgba(0,0,0,0.5); padding: 0.5rem 1rem; border-radius: 6px;
            pointer-events: none; transition: opacity 2s;
        }
        #event-toast {
            position: fixed; top: 3rem; left: 50%; transform: translateX(-50%);
            color: #fff; font-family: sans-serif; font-size: 0.9rem; font-weight: 600;
            background: rgba(0,0,0,0.7); padding: 0.6rem 1.2rem; border-radius: 8px;
            pointer-events: none; opacity: 0; transition: opacity 0.5s; z-index: 10;
        }
        .controls {
            position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%);
            display: flex; gap: 0.5rem;
            background: rgba(0,0,0,0.6); padding: 0.5rem 1rem; border-radius: 8px;
        }
        .controls button, .controls a {
            background: #333; color: #eee; border: 1px solid #555;
            padding: 0.4rem 0.8rem; border-radius: 4px; cursor: pointer;
            font-size: 0.8rem; text-decoration: none;
        }
        .controls button:hover, .controls a:hover { background: #555; }
        .controls button.active { background: #2563eb; border-color: #3b82f6; }

        /* Player directional controls */
        #player-controls {
            display: none;
            position: fixed; bottom: 5rem; right: 1rem;
            flex-direction: column; align-items: center; gap: 0.3rem;
            z-index: 20; touch-action: none;
        }
        #player-controls .row { display: flex; gap: 0.3rem; }
        #player-controls button {
            width: 3.2rem; height: 3.2rem;
            background: rgba(40,40,50,0.85); color: #fff; border: 1px solid #555;
            border-radius: 8px; font-size: 1.4rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            -webkit-user-select: none; user-select: none; touch-action: none;
        }
        #player-controls button:active { background: #2563eb; }
        #player-side-controls {
            position: fixed; bottom: 5rem; left: 1rem;
            display: none; flex-direction: column; gap: 0.4rem;
            z-index: 20;
        }
        #player-side-controls button {
            padding: 0.6rem 1rem; background: rgba(40,40,50,0.85);
            color: #fff; border: 1px solid #555; border-radius: 8px;
            font-size: 0.85rem; cursor: pointer; -webkit-user-select: none; user-select: none;
        }
        #player-side-controls button:active, #player-side-controls button.active { background: #2563eb; }
        #btn-exit-animal {
            display: none; position: fixed; top: 1rem; right: 1rem;
            background: rgba(180,40,40,0.85); color: #fff; border: 1px solid #a33;
            padding: 0.5rem 1rem; border-radius: 8px; font-size: 0.85rem;
            cursor: pointer; z-index: 20;
        }
    </style>
</head>
<body>
    <div class="info" id="info">Tap an animal to control it · Drag to orbit · Scroll to zoom</div>
    <div id="event-toast"></div>
    <canvas id="canvas"></canvas>

    <!-- Exit button -->
    <button id="btn-exit-animal">✕ Exit Animal</button>

    <!-- Directional pad -->
    <div id="player-controls">
        <div class="row"><button id="btn-up">▲</button></div>
        <div class="row">
            <button id="btn-left">◀</button>
            <button id="btn-jump">⬆</button>
            <button id="btn-right">▶</button>
        </div>
        <div class="row"><button id="btn-down">▼</button></div>
    </div>

    <!-- Side controls -->
    <div id="player-side-controls">
        <button id="btn-run">🚶 Walk</button>
    </div>

    <!-- Build number -->
    <div id="build-number" style="position:fixed;bottom:0.3rem;right:0.5rem;color:rgba(255,255,255,0.3);
        font-family:monospace;font-size:0.7rem;pointer-events:none;z-index:5"></div>

    <!-- Bottom bar -->
    <div class="controls">
        <a href="../index.html">&larr; Back</a>
        <button id="btn-spin" class="active">Auto Orbit</button>
        <button id="btn-speed">Speed: 1.5x</button>
    </div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
