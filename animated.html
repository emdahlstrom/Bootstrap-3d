<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap 3D - Animated Meadow</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; }
        canvas { display: block; width: 100vw; height: 100vh; }
        .info {
            position: fixed; top: 1rem; left: 50%; transform: translateX(-50%);
            color: #fff; font-family: sans-serif; font-size: 0.85rem;
            background: rgba(0,0,0,0.5); padding: 0.5rem 1rem; border-radius: 6px;
            pointer-events: none; transition: opacity 2s;
        }
        .controls {
            position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%);
            display: flex; gap: 0.5rem;
            background: rgba(0,0,0,0.6); padding: 0.5rem 1rem; border-radius: 8px;
        }
        .controls button, .controls a {
            background: #333; color: #eee; border: 1px solid #555;
            padding: 0.4rem 0.8rem; border-radius: 4px; cursor: pointer;
            font-size: 0.8rem; text-decoration: none;
        }
        .controls button:hover, .controls a:hover { background: #555; }
        .controls button.active { background: #2563eb; border-color: #3b82f6; }
    </style>
</head>
<body>

<div class="info" id="info">Drag to orbit &middot; Scroll to zoom</div>
<canvas id="canvas"></canvas>
<div class="controls">
    <a href="index.html">&larr; Back</a>
    <button id="btn-spin" class="active">Auto Orbit</button>
    <button id="btn-speed">Speed: 1.5x</button>
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// --- Setup ---
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.LinearToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();

// Sky gradient
const bgCanvas = document.createElement('canvas');
bgCanvas.width = 2; bgCanvas.height = 512;
const ctx = bgCanvas.getContext('2d');
const grad = ctx.createLinearGradient(0, 0, 0, 512);
grad.addColorStop(0.0, '#4488cc');
grad.addColorStop(0.4, '#7ab0dd');
grad.addColorStop(0.7, '#b8d8e8');
grad.addColorStop(1.0, '#d8e8d0');
ctx.fillStyle = grad;
ctx.fillRect(0, 0, 2, 512);
scene.background = new THREE.CanvasTexture(bgCanvas);

// Camera
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 500);
camera.position.set(15, 8, 15);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.target.set(0, 1, 0);
controls.maxDistance = 80;
controls.update();

// Lighting
scene.add(new THREE.AmbientLight(0x8899aa, 0.6));
const sun = new THREE.DirectionalLight(0xffeedd, 0.5);
sun.position.set(8, 12, -6);
scene.add(sun);

// --- Terrain with procedural heightmap ---

// Simple 2D noise (value noise with smoothstep interpolation)
function hashNoise(x, z) {
    let n = Math.sin(x * 127.1 + z * 311.7) * 43758.5453;
    return n - Math.floor(n);
}
function smoothstep(t) { return t * t * (3 - 2 * t); }
function valueNoise(x, z) {
    const ix = Math.floor(x), iz = Math.floor(z);
    const fx = x - ix, fz = z - iz;
    const sx = smoothstep(fx), sz = smoothstep(fz);
    const a = hashNoise(ix, iz), b = hashNoise(ix + 1, iz);
    const c = hashNoise(ix, iz + 1), d = hashNoise(ix + 1, iz + 1);
    return a + (b - a) * sx + (c - a) * sz + (a - b - c + d) * sx * sz;
}
function fbm(x, z, octaves = 4) {
    let val = 0, amp = 1, freq = 1, total = 0;
    for (let i = 0; i < octaves; i++) {
        val += valueNoise(x * freq, z * freq) * amp;
        total += amp;
        amp *= 0.5;
        freq *= 2;
    }
    return val / total;
}

// Terrain parameters
const TERRAIN_SIZE = 60;
const TERRAIN_SEG = 128;
const TERRAIN_HEIGHT = 4.0; // max hill height
const TERRAIN_SCALE = 0.08; // noise frequency

function getTerrainHeight(x, z) {
    const h = fbm(x * TERRAIN_SCALE + 50, z * TERRAIN_SCALE + 50, 5);
    // Flatten center for the meadow, hills at edges
    const distFromCenter = Math.sqrt(x * x + z * z);
    const edgeFactor = Math.min(distFromCenter / 15, 1);
    return h * TERRAIN_HEIGHT * edgeFactor * edgeFactor;
}

function getTerrainNormal(x, z) {
    const eps = 0.3;
    const hL = getTerrainHeight(x - eps, z);
    const hR = getTerrainHeight(x + eps, z);
    const hD = getTerrainHeight(x, z - eps);
    const hU = getTerrainHeight(x, z + eps);
    const n = new THREE.Vector3(hL - hR, 2 * eps, hD - hU).normalize();
    return n;
}

// Build terrain mesh
const terrainGeo = new THREE.PlaneGeometry(TERRAIN_SIZE, TERRAIN_SIZE, TERRAIN_SEG, TERRAIN_SEG);
terrainGeo.rotateX(-Math.PI / 2);

const positions = terrainGeo.attributes.position;
const colors = new Float32Array(positions.count * 3);

for (let i = 0; i < positions.count; i++) {
    const x = positions.getX(i);
    const z = positions.getZ(i);
    const y = getTerrainHeight(x, z);
    positions.setY(i, y);

    // Vertex colors based on height + slope
    const slope = 1 - getTerrainNormal(x, z).y; // 0 = flat, 1 = vertical
    const t = y / TERRAIN_HEIGHT;

    // Green meadow -> brown dirt -> grey rock
    let r, g, b;
    if (t < 0.3) {
        // Low: lush green
        r = 0.22 + slope * 0.15;
        g = 0.50 + fbm(x * 0.3, z * 0.3, 2) * 0.15;
        b = 0.12;
    } else if (t < 0.6) {
        // Mid: yellow-green
        const f = (t - 0.3) / 0.3;
        r = 0.22 + f * 0.3;
        g = 0.50 - f * 0.1;
        b = 0.12 + f * 0.05;
    } else {
        // High: brown/rocky
        const f = (t - 0.6) / 0.4;
        r = 0.45 + f * 0.15;
        g = 0.38 - f * 0.1;
        b = 0.20 + f * 0.1;
    }
    colors[i * 3] = r;
    colors[i * 3 + 1] = g;
    colors[i * 3 + 2] = b;
}

terrainGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
terrainGeo.computeVertexNormals();

const terrainMat = new THREE.MeshBasicMaterial({ vertexColors: true });
const terrain = new THREE.Mesh(terrainGeo, terrainMat);
scene.add(terrain);

// --- Obstacles (rocks and trees register as collision objects) ---
const obstacles = []; // { position: Vector3, radius: number }

// --- Load helpers ---
const loader = new GLTFLoader();
const clock = new THREE.Clock();
const mixers = [];

// Boid animals
const boids = [];
const BOUNDS = 18; // meadow radius

// --- Boids parameters ---
const BOID = {
    separationDist: 3.0,
    separationWeight: 2.5,
    alignmentDist: 8.0,
    alignmentWeight: 0.8,
    cohesionDist: 12.0,
    cohesionWeight: 0.6,
    boundaryWeight: 1.5,
    wanderWeight: 0.4,
    maxSpeed: 3.0,
    maxForce: 1.5,
    // Fox predator behavior
    fleeDistance: 8.0,
    fleeWeight: 4.0,
    chaseWeight: 1.2,
    chaseDistance: 15.0,
};

class Boid {
    constructor(model, mixer, type = 'deer') {
        this.model = model;
        this.mixer = mixer;
        this.type = type; // 'deer' or 'fox'
        this.velocity = new THREE.Vector3(rand(-1, 1), 0, rand(-1, 1)).normalize().multiplyScalar(1.5);
        this.acceleration = new THREE.Vector3();
        this.maxSpeed = type === 'fox' ? BOID.maxSpeed * 1.4 : BOID.maxSpeed;
        this.maxForce = BOID.maxForce;
        this.wanderAngle = rand(0, Math.PI * 2);
    }

    applyForce(force) {
        this.acceleration.add(force);
    }

    // Steer towards a target position
    seek(target) {
        const desired = new THREE.Vector3().subVectors(target, this.model.position);
        desired.y = 0;
        desired.normalize().multiplyScalar(this.maxSpeed);
        const steer = new THREE.Vector3().subVectors(desired, this.velocity);
        steer.clampLength(0, this.maxForce);
        return steer;
    }

    // Flee from a position
    flee(target) {
        return this.seek(target).negate();
    }

    // Separation: steer away from nearby same-type boids
    separate(boids) {
        const steer = new THREE.Vector3();
        let count = 0;
        for (const other of boids) {
            if (other === this) continue;
            const d = this.model.position.distanceTo(other.model.position);
            if (d > 0 && d < BOID.separationDist) {
                const diff = new THREE.Vector3().subVectors(this.model.position, other.model.position);
                diff.y = 0;
                diff.normalize().divideScalar(d); // weight by distance
                steer.add(diff);
                count++;
            }
        }
        if (count > 0) {
            steer.divideScalar(count);
            steer.normalize().multiplyScalar(this.maxSpeed);
            steer.sub(this.velocity);
            steer.clampLength(0, this.maxForce);
        }
        return steer;
    }

    // Alignment: steer towards average heading of nearby same-type boids
    align(boids) {
        const avg = new THREE.Vector3();
        let count = 0;
        for (const other of boids) {
            if (other === this || other.type !== this.type) continue;
            const d = this.model.position.distanceTo(other.model.position);
            if (d > 0 && d < BOID.alignmentDist) {
                avg.add(other.velocity);
                count++;
            }
        }
        if (count > 0) {
            avg.divideScalar(count);
            avg.normalize().multiplyScalar(this.maxSpeed);
            const steer = new THREE.Vector3().subVectors(avg, this.velocity);
            steer.clampLength(0, this.maxForce);
            return steer;
        }
        return new THREE.Vector3();
    }

    // Cohesion: steer towards center of nearby same-type boids
    cohere(boids) {
        const center = new THREE.Vector3();
        let count = 0;
        for (const other of boids) {
            if (other === this || other.type !== this.type) continue;
            const d = this.model.position.distanceTo(other.model.position);
            if (d > 0 && d < BOID.cohesionDist) {
                center.add(other.model.position);
                count++;
            }
        }
        if (count > 0) {
            center.divideScalar(count);
            return this.seek(center);
        }
        return new THREE.Vector3();
    }

    // Stay within bounds
    boundaries() {
        const pos = this.model.position;
        const steer = new THREE.Vector3();
        const margin = 3;
        const limit = BOUNDS - margin;
        if (pos.x > limit) steer.x = -BOID.boundaryWeight;
        if (pos.x < -limit) steer.x = BOID.boundaryWeight;
        if (pos.z > limit) steer.z = -BOID.boundaryWeight;
        if (pos.z < -limit) steer.z = BOID.boundaryWeight;
        return steer;
    }

    // Avoid obstacle collisions (trees, rocks)
    avoidObstacles() {
        const steer = new THREE.Vector3();
        const avoidDist = 3.0;
        for (const obs of obstacles) {
            const dx = this.model.position.x - obs.position.x;
            const dz = this.model.position.z - obs.position.z;
            const d = Math.sqrt(dx * dx + dz * dz);
            const minDist = obs.radius + avoidDist;
            if (d < minDist && d > 0.01) {
                // Push away, stronger when closer
                const strength = (1 - d / minDist) * 4.0;
                steer.x += (dx / d) * strength;
                steer.z += (dz / d) * strength;
            }
        }
        return steer;
    }

    // Slope force: slide downhill slightly, avoid steep climbs
    slopeForce() {
        const pos = this.model.position;
        const normal = getTerrainNormal(pos.x, pos.z);
        // Project normal onto XZ plane = downhill direction
        const downhill = new THREE.Vector3(-normal.x, 0, -normal.z);
        const steepness = downhill.length();
        // Slow down on steep slopes, push downhill
        if (steepness > 0.2) {
            return downhill.normalize().multiplyScalar(steepness * 2.0);
        }
        return new THREE.Vector3();
    }

    // Gentle random wander
    wander() {
        this.wanderAngle += rand(-0.3, 0.3);
        return new THREE.Vector3(
            Math.cos(this.wanderAngle) * BOID.wanderWeight,
            0,
            Math.sin(this.wanderAngle) * BOID.wanderWeight
        );
    }

    update(delta, allBoids) {
        this.acceleration.set(0, 0, 0);

        if (this.type === 'fox') {
            // Fox: chase nearest deer
            let nearest = null;
            let nearestDist = Infinity;
            for (const b of allBoids) {
                if (b.type !== 'deer') continue;
                const d = this.model.position.distanceTo(b.model.position);
                if (d < nearestDist) { nearestDist = d; nearest = b; }
            }
            if (nearest && nearestDist < BOID.chaseDistance) {
                this.applyForce(this.seek(nearest.model.position).multiplyScalar(BOID.chaseWeight));
            } else {
                this.applyForce(this.wander());
            }
            this.applyForce(this.separate(allBoids).multiplyScalar(BOID.separationWeight));
        } else {
            // Deer: flock together, flee from fox
            this.applyForce(this.separate(allBoids).multiplyScalar(BOID.separationWeight));
            this.applyForce(this.align(allBoids).multiplyScalar(BOID.alignmentWeight));
            this.applyForce(this.cohere(allBoids).multiplyScalar(BOID.cohesionWeight));
            this.applyForce(this.wander());

            // Flee from foxes
            for (const b of allBoids) {
                if (b.type !== 'fox') continue;
                const d = this.model.position.distanceTo(b.model.position);
                if (d < BOID.fleeDistance) {
                    const fleeForce = this.flee(b.model.position).multiplyScalar(BOID.fleeWeight * (1 - d / BOID.fleeDistance));
                    this.applyForce(fleeForce);
                }
            }
        }

        // Stay in bounds
        this.applyForce(this.boundaries());

        // Avoid obstacles (trees, rocks)
        this.applyForce(this.avoidObstacles());

        // Slope physics
        this.applyForce(this.slopeForce());

        // Integrate
        this.velocity.add(this.acceleration.multiplyScalar(delta));
        this.velocity.y = 0; // XZ movement only
        // Slow down on steep terrain
        const terrainNormal = getTerrainNormal(this.model.position.x, this.model.position.z);
        const slopeSlowdown = Math.max(0.3, terrainNormal.y); // flatter = faster
        this.velocity.clampLength(0, this.maxSpeed * slopeSlowdown);

        this.model.position.add(this.velocity.clone().multiplyScalar(delta));

        // Snap to terrain height (ground following)
        const groundY = getTerrainHeight(this.model.position.x, this.model.position.z);
        this.model.position.y = groundY;

        // Tilt model to match terrain slope
        const normal = getTerrainNormal(this.model.position.x, this.model.position.z);
        // Pitch forward/backward based on slope in movement direction
        const moveDir = this.velocity.clone().normalize();
        const slopePitch = -Math.asin(normal.x * moveDir.x + normal.z * moveDir.z) * 0.5;
        this.model.rotation.x = slopePitch;

        // Face direction of movement
        if (this.velocity.length() > 0.1) {
            const targetAngle = Math.atan2(this.velocity.x, this.velocity.z);
            // Smooth rotation
            let current = this.model.rotation.y;
            let diff = targetAngle - current;
            // Wrap angle
            while (diff > Math.PI) diff -= Math.PI * 2;
            while (diff < -Math.PI) diff += Math.PI * 2;
            this.model.rotation.y += diff * Math.min(delta * 5, 1);
        }

        // Update skeleton animation
        if (this.mixer) {
            this.mixer.update(delta * 1.5); // slightly faster leg animation
        }
    }
}

function loadBoid(url, position, scale, animName, type) {
    // Snap to terrain
    position.y = getTerrainHeight(position.x, position.z);

    return new Promise((resolve) => {
        loader.load(url, (gltf) => {
            const model = gltf.scene;
            model.position.copy(position);
            model.scale.setScalar(scale);

            model.traverse((child) => {
                if (child.isMesh && child.material) {
                    const mat = child.material;
                    child.material = new THREE.MeshBasicMaterial({
                        color: mat.color ? mat.color.clone() : new THREE.Color(0xcccccc),
                    });
                }
            });

            scene.add(model);

            const mixer = new THREE.AnimationMixer(model);
            const clip = gltf.animations.find(a => a.name.includes(animName));
            if (clip) {
                const action = mixer.clipAction(clip);
                action.timeScale = 1.5;
                action.play();
            }

            const boid = new Boid(model, mixer, type);
            boids.push(boid);
            resolve(boid);
        });
    });
}

function loadNature(url, position, rotY, scale, collisionRadius = 0) {
    // Place on terrain
    position.y = getTerrainHeight(position.x, position.z);

    loader.load(url, (gltf) => {
        const model = gltf.scene;
        model.position.copy(position);
        model.rotation.y = rotY;
        model.scale.setScalar(scale);
        model.traverse((child) => {
            if (child.isMesh && child.material) {
                child.material = new THREE.MeshBasicMaterial({
                    color: child.material.color ? child.material.color.clone() : new THREE.Color(0x55aa33),
                });
            }
        });
        scene.add(model);
    });

    // Register as obstacle for collision
    if (collisionRadius > 0) {
        obstacles.push({ position: position.clone(), radius: collisionRadius });
    }
}

// --- Scatter nature ---
const rand = (min, max) => min + Math.random() * (max - min);
const natBase = 'models/nature/';

// Trees — register as collision obstacles
for (let i = 0; i < 8; i++) {
    const angle = (i / 8) * Math.PI * 2;
    const r = 18 + rand(-3, 3);
    loadNature(natBase + 'CommonTree_1.glb', new THREE.Vector3(Math.cos(angle)*r, 0, Math.sin(angle)*r), rand(0, 6.28), rand(1.5, 2.5), 1.5);
}
for (let i = 0; i < 5; i++) {
    const angle = (i / 5) * Math.PI * 2 + 0.3;
    const r = 22 + rand(-2, 2);
    loadNature(natBase + 'PineTree_1.glb', new THREE.Vector3(Math.cos(angle)*r, 0, Math.sin(angle)*r), rand(0, 6.28), rand(2, 3), 1.2);
}
for (let i = 0; i < 3; i++) {
    loadNature(natBase + 'BirchTree_1.glb', new THREE.Vector3(rand(-15, -8), 0, rand(-5, 5)), rand(0, 6.28), rand(1.5, 2.2), 1.0);
}
// Grass, flowers — no collision
for (let i = 0; i < 20; i++) {
    loadNature(natBase + 'Grass.glb', new THREE.Vector3(rand(-12, 12), 0, rand(-12, 12)), rand(0, 6.28), rand(0.8, 1.5));
}
for (let i = 0; i < 10; i++) {
    loadNature(natBase + 'Bush_1.glb', new THREE.Vector3(rand(-15, 15), 0, rand(-15, 15)), rand(0, 6.28), rand(1, 1.5), 0.8);
}
for (let i = 0; i < 8; i++) {
    loadNature(natBase + 'Flowers.glb', new THREE.Vector3(rand(-10, 10), 0, rand(-10, 10)), rand(0, 6.28), rand(0.6, 1.2));
}
// Rocks — solid obstacles
for (let i = 0; i < 5; i++) {
    loadNature(natBase + ['Rock_1.glb', 'Rock_Moss_1.glb'][i % 2], new THREE.Vector3(rand(-15, 15), 0, rand(-15, 15)), rand(0, 6.28), rand(1.5, 3), 1.5);
}

// --- Spawn boids ---
const animalBase = 'models/animals/';

// Deer herd (5 deer that flock together)
for (let i = 0; i < 5; i++) {
    const angle = rand(0, Math.PI * 2);
    const r = rand(2, 6);
    loadBoid(animalBase + 'Deer.glb',
        new THREE.Vector3(Math.cos(angle) * r, 0, Math.sin(angle) * r),
        rand(0.9, 1.1), 'Walk', 'deer');
}

// Stag pair
for (let i = 0; i < 2; i++) {
    loadBoid(animalBase + 'Stag.glb',
        new THREE.Vector3(rand(-8, -4), 0, rand(-6, 6)),
        rand(1.1, 1.3), 'Walk', 'deer');
}

// Fox — the predator
loadBoid(animalBase + 'Fox.glb',
    new THREE.Vector3(12, 0, 0),
    0.8, 'Gallop', 'fox');

// --- Animation loop ---
let autoOrbit = true;
let speedMultiplier = 1.5; // start faster

function animate() {
    requestAnimationFrame(animate);
    const rawDelta = clock.getDelta();
    const delta = rawDelta * speedMultiplier;

    // Update all boids
    for (const boid of boids) {
        boid.update(delta, boids);
    }

    // Auto orbit camera
    if (autoOrbit) {
        const t = clock.elapsedTime * 0.12;
        const radius = 22;
        camera.position.x = Math.cos(t) * radius;
        camera.position.z = Math.sin(t) * radius;
        camera.position.y = 9 + Math.sin(t * 0.5) * 3;
        controls.target.set(0, 1, 0);
    }

    controls.update();
    renderer.render(scene, camera);
}

animate();

// --- UI ---
document.getElementById('btn-spin').addEventListener('click', (e) => {
    autoOrbit = !autoOrbit;
    e.target.classList.toggle('active', autoOrbit);
});

const speeds = [1.5, 2.5, 1, 0.5];
let speedIdx = 0;
document.getElementById('btn-speed').addEventListener('click', (e) => {
    speedIdx = (speedIdx + 1) % speeds.length;
    speedMultiplier = speeds[speedIdx];
    e.target.textContent = `Speed: ${speedMultiplier}x`;
});

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

setTimeout(() => { document.getElementById('info').style.opacity = '0'; }, 5000);
</script>

</body>
</html>
