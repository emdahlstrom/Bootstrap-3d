<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap 3D - Animated Meadow</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; }
        canvas { display: block; width: 100vw; height: 100vh; }
        .info {
            position: fixed; top: 1rem; left: 50%; transform: translateX(-50%);
            color: #fff; font-family: sans-serif; font-size: 0.85rem;
            background: rgba(0,0,0,0.5); padding: 0.5rem 1rem; border-radius: 6px;
            pointer-events: none; transition: opacity 2s;
        }
        .controls {
            position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%);
            display: flex; gap: 0.5rem;
            background: rgba(0,0,0,0.6); padding: 0.5rem 1rem; border-radius: 8px;
        }
        .controls button, .controls a {
            background: #333; color: #eee; border: 1px solid #555;
            padding: 0.4rem 0.8rem; border-radius: 4px; cursor: pointer;
            font-size: 0.8rem; text-decoration: none;
        }
        .controls button:hover, .controls a:hover { background: #555; }
        .controls button.active { background: #2563eb; border-color: #3b82f6; }
    </style>
</head>
<body>

<div class="info" id="info">Drag to orbit &middot; Scroll to zoom</div>
<canvas id="canvas"></canvas>
<div class="controls">
    <a href="index.html">&larr; Back</a>
    <button id="btn-spin" class="active">Auto Orbit</button>
    <button id="btn-speed">Speed: 1.5x</button>
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// --- Setup ---
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.LinearToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();

// Sky gradient
const bgCanvas = document.createElement('canvas');
bgCanvas.width = 2; bgCanvas.height = 512;
const ctx = bgCanvas.getContext('2d');
const grad = ctx.createLinearGradient(0, 0, 0, 512);
grad.addColorStop(0.0, '#4488cc');
grad.addColorStop(0.4, '#7ab0dd');
grad.addColorStop(0.7, '#b8d8e8');
grad.addColorStop(1.0, '#d8e8d0');
ctx.fillStyle = grad;
ctx.fillRect(0, 0, 2, 512);
scene.background = new THREE.CanvasTexture(bgCanvas);

// Camera
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 500);
camera.position.set(15, 8, 15);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.target.set(0, 1, 0);
controls.maxDistance = 80;
controls.update();

// Lighting
scene.add(new THREE.AmbientLight(0x8899aa, 0.6));
const sun = new THREE.DirectionalLight(0xffeedd, 0.5);
sun.position.set(8, 12, -6);
scene.add(sun);

// --- Ground ---
const groundMat = new THREE.MeshBasicMaterial({ color: 0x4a8a2a });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.01;
scene.add(ground);

// --- Load helpers ---
const loader = new GLTFLoader();
const clock = new THREE.Clock();
const mixers = [];

// Boid animals
const boids = [];
const BOUNDS = 18; // meadow radius

// --- Boids parameters ---
const BOID = {
    separationDist: 3.0,
    separationWeight: 2.5,
    alignmentDist: 8.0,
    alignmentWeight: 0.8,
    cohesionDist: 12.0,
    cohesionWeight: 0.6,
    boundaryWeight: 1.5,
    wanderWeight: 0.4,
    maxSpeed: 3.0,
    maxForce: 1.5,
    // Fox predator behavior
    fleeDistance: 8.0,
    fleeWeight: 4.0,
    chaseWeight: 1.2,
    chaseDistance: 15.0,
};

class Boid {
    constructor(model, mixer, type = 'deer') {
        this.model = model;
        this.mixer = mixer;
        this.type = type; // 'deer' or 'fox'
        this.velocity = new THREE.Vector3(rand(-1, 1), 0, rand(-1, 1)).normalize().multiplyScalar(1.5);
        this.acceleration = new THREE.Vector3();
        this.maxSpeed = type === 'fox' ? BOID.maxSpeed * 1.4 : BOID.maxSpeed;
        this.maxForce = BOID.maxForce;
        this.wanderAngle = rand(0, Math.PI * 2);
    }

    applyForce(force) {
        this.acceleration.add(force);
    }

    // Steer towards a target position
    seek(target) {
        const desired = new THREE.Vector3().subVectors(target, this.model.position);
        desired.y = 0;
        desired.normalize().multiplyScalar(this.maxSpeed);
        const steer = new THREE.Vector3().subVectors(desired, this.velocity);
        steer.clampLength(0, this.maxForce);
        return steer;
    }

    // Flee from a position
    flee(target) {
        return this.seek(target).negate();
    }

    // Separation: steer away from nearby same-type boids
    separate(boids) {
        const steer = new THREE.Vector3();
        let count = 0;
        for (const other of boids) {
            if (other === this) continue;
            const d = this.model.position.distanceTo(other.model.position);
            if (d > 0 && d < BOID.separationDist) {
                const diff = new THREE.Vector3().subVectors(this.model.position, other.model.position);
                diff.y = 0;
                diff.normalize().divideScalar(d); // weight by distance
                steer.add(diff);
                count++;
            }
        }
        if (count > 0) {
            steer.divideScalar(count);
            steer.normalize().multiplyScalar(this.maxSpeed);
            steer.sub(this.velocity);
            steer.clampLength(0, this.maxForce);
        }
        return steer;
    }

    // Alignment: steer towards average heading of nearby same-type boids
    align(boids) {
        const avg = new THREE.Vector3();
        let count = 0;
        for (const other of boids) {
            if (other === this || other.type !== this.type) continue;
            const d = this.model.position.distanceTo(other.model.position);
            if (d > 0 && d < BOID.alignmentDist) {
                avg.add(other.velocity);
                count++;
            }
        }
        if (count > 0) {
            avg.divideScalar(count);
            avg.normalize().multiplyScalar(this.maxSpeed);
            const steer = new THREE.Vector3().subVectors(avg, this.velocity);
            steer.clampLength(0, this.maxForce);
            return steer;
        }
        return new THREE.Vector3();
    }

    // Cohesion: steer towards center of nearby same-type boids
    cohere(boids) {
        const center = new THREE.Vector3();
        let count = 0;
        for (const other of boids) {
            if (other === this || other.type !== this.type) continue;
            const d = this.model.position.distanceTo(other.model.position);
            if (d > 0 && d < BOID.cohesionDist) {
                center.add(other.model.position);
                count++;
            }
        }
        if (count > 0) {
            center.divideScalar(count);
            return this.seek(center);
        }
        return new THREE.Vector3();
    }

    // Stay within bounds
    boundaries() {
        const pos = this.model.position;
        const steer = new THREE.Vector3();
        const margin = 3;
        const limit = BOUNDS - margin;
        if (pos.x > limit) steer.x = -BOID.boundaryWeight;
        if (pos.x < -limit) steer.x = BOID.boundaryWeight;
        if (pos.z > limit) steer.z = -BOID.boundaryWeight;
        if (pos.z < -limit) steer.z = BOID.boundaryWeight;
        return steer;
    }

    // Gentle random wander
    wander() {
        this.wanderAngle += rand(-0.3, 0.3);
        return new THREE.Vector3(
            Math.cos(this.wanderAngle) * BOID.wanderWeight,
            0,
            Math.sin(this.wanderAngle) * BOID.wanderWeight
        );
    }

    update(delta, allBoids) {
        this.acceleration.set(0, 0, 0);

        if (this.type === 'fox') {
            // Fox: chase nearest deer
            let nearest = null;
            let nearestDist = Infinity;
            for (const b of allBoids) {
                if (b.type !== 'deer') continue;
                const d = this.model.position.distanceTo(b.model.position);
                if (d < nearestDist) { nearestDist = d; nearest = b; }
            }
            if (nearest && nearestDist < BOID.chaseDistance) {
                this.applyForce(this.seek(nearest.model.position).multiplyScalar(BOID.chaseWeight));
            } else {
                this.applyForce(this.wander());
            }
            this.applyForce(this.separate(allBoids).multiplyScalar(BOID.separationWeight));
        } else {
            // Deer: flock together, flee from fox
            this.applyForce(this.separate(allBoids).multiplyScalar(BOID.separationWeight));
            this.applyForce(this.align(allBoids).multiplyScalar(BOID.alignmentWeight));
            this.applyForce(this.cohere(allBoids).multiplyScalar(BOID.cohesionWeight));
            this.applyForce(this.wander());

            // Flee from foxes
            for (const b of allBoids) {
                if (b.type !== 'fox') continue;
                const d = this.model.position.distanceTo(b.model.position);
                if (d < BOID.fleeDistance) {
                    const fleeForce = this.flee(b.model.position).multiplyScalar(BOID.fleeWeight * (1 - d / BOID.fleeDistance));
                    this.applyForce(fleeForce);
                }
            }
        }

        // Stay in bounds
        this.applyForce(this.boundaries());

        // Integrate
        this.velocity.add(this.acceleration.multiplyScalar(delta));
        this.velocity.y = 0; // stay on ground
        this.velocity.clampLength(0, this.maxSpeed);

        this.model.position.add(this.velocity.clone().multiplyScalar(delta));
        this.model.position.y = 0;

        // Face direction of movement
        if (this.velocity.length() > 0.1) {
            const targetAngle = Math.atan2(this.velocity.x, this.velocity.z);
            // Smooth rotation
            let current = this.model.rotation.y;
            let diff = targetAngle - current;
            // Wrap angle
            while (diff > Math.PI) diff -= Math.PI * 2;
            while (diff < -Math.PI) diff += Math.PI * 2;
            this.model.rotation.y += diff * Math.min(delta * 5, 1);
        }

        // Update skeleton animation
        if (this.mixer) {
            this.mixer.update(delta * 1.5); // slightly faster leg animation
        }
    }
}

function loadBoid(url, position, scale, animName, type) {
    return new Promise((resolve) => {
        loader.load(url, (gltf) => {
            const model = gltf.scene;
            model.position.copy(position);
            model.scale.setScalar(scale);

            model.traverse((child) => {
                if (child.isMesh && child.material) {
                    const mat = child.material;
                    child.material = new THREE.MeshBasicMaterial({
                        color: mat.color ? mat.color.clone() : new THREE.Color(0xcccccc),
                    });
                }
            });

            scene.add(model);

            const mixer = new THREE.AnimationMixer(model);
            const clip = gltf.animations.find(a => a.name.includes(animName));
            if (clip) {
                const action = mixer.clipAction(clip);
                action.timeScale = 1.5;
                action.play();
            }

            const boid = new Boid(model, mixer, type);
            boids.push(boid);
            resolve(boid);
        });
    });
}

function loadNature(url, position, rotY, scale) {
    loader.load(url, (gltf) => {
        const model = gltf.scene;
        model.position.copy(position);
        model.rotation.y = rotY;
        model.scale.setScalar(scale);
        model.traverse((child) => {
            if (child.isMesh && child.material) {
                child.material = new THREE.MeshBasicMaterial({
                    color: child.material.color ? child.material.color.clone() : new THREE.Color(0x55aa33),
                });
            }
        });
        scene.add(model);
    });
}

// --- Scatter nature ---
const rand = (min, max) => min + Math.random() * (max - min);
const natBase = 'models/nature/';

for (let i = 0; i < 8; i++) {
    const angle = (i / 8) * Math.PI * 2;
    const r = 18 + rand(-3, 3);
    loadNature(natBase + 'CommonTree_1.glb', new THREE.Vector3(Math.cos(angle)*r, 0, Math.sin(angle)*r), rand(0, 6.28), rand(1.5, 2.5));
}
for (let i = 0; i < 5; i++) {
    const angle = (i / 5) * Math.PI * 2 + 0.3;
    const r = 22 + rand(-2, 2);
    loadNature(natBase + 'PineTree_1.glb', new THREE.Vector3(Math.cos(angle)*r, 0, Math.sin(angle)*r), rand(0, 6.28), rand(2, 3));
}
for (let i = 0; i < 3; i++) {
    loadNature(natBase + 'BirchTree_1.glb', new THREE.Vector3(rand(-15, -8), 0, rand(-5, 5)), rand(0, 6.28), rand(1.5, 2.2));
}
for (let i = 0; i < 20; i++) {
    loadNature(natBase + 'Grass.glb', new THREE.Vector3(rand(-12, 12), 0, rand(-12, 12)), rand(0, 6.28), rand(0.8, 1.5));
}
for (let i = 0; i < 10; i++) {
    loadNature(natBase + 'Bush_1.glb', new THREE.Vector3(rand(-15, 15), 0, rand(-15, 15)), rand(0, 6.28), rand(1, 1.5));
}
for (let i = 0; i < 8; i++) {
    loadNature(natBase + 'Flowers.glb', new THREE.Vector3(rand(-10, 10), 0, rand(-10, 10)), rand(0, 6.28), rand(0.6, 1.2));
}
for (let i = 0; i < 5; i++) {
    loadNature(natBase + ['Rock_1.glb', 'Rock_Moss_1.glb'][i % 2], new THREE.Vector3(rand(-15, 15), 0, rand(-15, 15)), rand(0, 6.28), rand(1.5, 3));
}

// --- Spawn boids ---
const animalBase = 'models/animals/';

// Deer herd (5 deer that flock together)
for (let i = 0; i < 5; i++) {
    const angle = rand(0, Math.PI * 2);
    const r = rand(2, 6);
    loadBoid(animalBase + 'Deer.glb',
        new THREE.Vector3(Math.cos(angle) * r, 0, Math.sin(angle) * r),
        rand(0.9, 1.1), 'Walk', 'deer');
}

// Stag pair
for (let i = 0; i < 2; i++) {
    loadBoid(animalBase + 'Stag.glb',
        new THREE.Vector3(rand(-8, -4), 0, rand(-6, 6)),
        rand(1.1, 1.3), 'Walk', 'deer');
}

// Fox — the predator
loadBoid(animalBase + 'Fox.glb',
    new THREE.Vector3(12, 0, 0),
    0.8, 'Gallop', 'fox');

// --- Animation loop ---
let autoOrbit = true;
let speedMultiplier = 1.5; // start faster

function animate() {
    requestAnimationFrame(animate);
    const rawDelta = clock.getDelta();
    const delta = rawDelta * speedMultiplier;

    // Update all boids
    for (const boid of boids) {
        boid.update(delta, boids);
    }

    // Auto orbit camera
    if (autoOrbit) {
        const t = clock.elapsedTime * 0.12;
        const radius = 22;
        camera.position.x = Math.cos(t) * radius;
        camera.position.z = Math.sin(t) * radius;
        camera.position.y = 9 + Math.sin(t * 0.5) * 3;
        controls.target.set(0, 1, 0);
    }

    controls.update();
    renderer.render(scene, camera);
}

animate();

// --- UI ---
document.getElementById('btn-spin').addEventListener('click', (e) => {
    autoOrbit = !autoOrbit;
    e.target.classList.toggle('active', autoOrbit);
});

const speeds = [1.5, 2.5, 1, 0.5];
let speedIdx = 0;
document.getElementById('btn-speed').addEventListener('click', (e) => {
    speedIdx = (speedIdx + 1) % speeds.length;
    speedMultiplier = speeds[speedIdx];
    e.target.textContent = `Speed: ${speedMultiplier}x`;
});

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

setTimeout(() => { document.getElementById('info').style.opacity = '0'; }, 5000);
</script>

</body>
</html>
