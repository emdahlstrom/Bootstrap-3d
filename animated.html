<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap 3D - Animated Meadow</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; }
        canvas { display: block; width: 100vw; height: 100vh; }
        .info {
            position: fixed; top: 1rem; left: 50%; transform: translateX(-50%);
            color: #fff; font-family: sans-serif; font-size: 0.85rem;
            background: rgba(0,0,0,0.5); padding: 0.5rem 1rem; border-radius: 6px;
            pointer-events: none; transition: opacity 2s;
        }
        .controls {
            position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%);
            display: flex; gap: 0.5rem;
            background: rgba(0,0,0,0.6); padding: 0.5rem 1rem; border-radius: 8px;
        }
        .controls button, .controls a {
            background: #333; color: #eee; border: 1px solid #555;
            padding: 0.4rem 0.8rem; border-radius: 4px; cursor: pointer;
            font-size: 0.8rem; text-decoration: none;
        }
        .controls button:hover, .controls a:hover { background: #555; }
        .controls button.active { background: #2563eb; border-color: #3b82f6; }
    </style>
</head>
<body>

<div class="info" id="info">Drag to orbit &middot; Scroll to zoom</div>
<div id="event-toast" style="position:fixed;top:3rem;left:50%;transform:translateX(-50%);
    color:#fff;font-family:sans-serif;font-size:0.9rem;font-weight:600;
    background:rgba(0,0,0,0.7);padding:0.6rem 1.2rem;border-radius:8px;
    pointer-events:none;opacity:0;transition:opacity 0.5s;z-index:10"></div>
<canvas id="canvas"></canvas>
<div class="controls">
    <a href="index.html">&larr; Back</a>
    <button id="btn-spin" class="active">Auto Orbit</button>
    <button id="btn-speed">Speed: 1.5x</button>
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// --- Setup ---
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.LinearToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();

// Sky gradient
const bgCanvas = document.createElement('canvas');
bgCanvas.width = 2; bgCanvas.height = 512;
const ctx = bgCanvas.getContext('2d');
const grad = ctx.createLinearGradient(0, 0, 0, 512);
grad.addColorStop(0.0, '#4488cc');
grad.addColorStop(0.4, '#7ab0dd');
grad.addColorStop(0.7, '#b8d8e8');
grad.addColorStop(1.0, '#d8e8d0');
ctx.fillStyle = grad;
ctx.fillRect(0, 0, 2, 512);
scene.background = new THREE.CanvasTexture(bgCanvas);

// Camera
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 500);
camera.position.set(15, 8, 15);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.target.set(0, 1, 0);
controls.maxDistance = 80;
controls.update();

// Lighting
scene.add(new THREE.AmbientLight(0x8899aa, 0.6));
const sun = new THREE.DirectionalLight(0xffeedd, 0.5);
sun.position.set(8, 12, -6);
scene.add(sun);

// --- Terrain with procedural heightmap ---

// Simple 2D noise (value noise with smoothstep interpolation)
function hashNoise(x, z) {
    let n = Math.sin(x * 127.1 + z * 311.7) * 43758.5453;
    return n - Math.floor(n);
}
function smoothstep(t) { return t * t * (3 - 2 * t); }
function valueNoise(x, z) {
    const ix = Math.floor(x), iz = Math.floor(z);
    const fx = x - ix, fz = z - iz;
    const sx = smoothstep(fx), sz = smoothstep(fz);
    const a = hashNoise(ix, iz), b = hashNoise(ix + 1, iz);
    const c = hashNoise(ix, iz + 1), d = hashNoise(ix + 1, iz + 1);
    return a + (b - a) * sx + (c - a) * sz + (a - b - c + d) * sx * sz;
}
function fbm(x, z, octaves = 4) {
    let val = 0, amp = 1, freq = 1, total = 0;
    for (let i = 0; i < octaves; i++) {
        val += valueNoise(x * freq, z * freq) * amp;
        total += amp;
        amp *= 0.5;
        freq *= 2;
    }
    return val / total;
}

// Terrain parameters
const TERRAIN_SIZE = 60;
const TERRAIN_SEG = 128;
const TERRAIN_HEIGHT = 10.0;
const TERRAIN_SCALE = 0.06;

function getTerrainHeight(x, z) {
    // Base rolling hills
    const h = fbm(x * TERRAIN_SCALE + 50, z * TERRAIN_SCALE + 50, 5);
    // Ridge along one side
    const ridge = Math.exp(-((x + 12) * (x + 12)) / 30) * 3.0;
    // Valley through center
    const valley = -Math.exp(-(z * z) / 60) * 1.5;
    // Flatten center meadow, raise edges
    const dist = Math.sqrt(x * x + z * z);
    const edgeFactor = Math.min(dist / 12, 1);
    return (h * TERRAIN_HEIGHT * edgeFactor + ridge + valley) * edgeFactor;
}

function getTerrainNormal(x, z) {
    const eps = 0.3;
    const hL = getTerrainHeight(x - eps, z);
    const hR = getTerrainHeight(x + eps, z);
    const hD = getTerrainHeight(x, z - eps);
    const hU = getTerrainHeight(x, z + eps);
    const n = new THREE.Vector3(hL - hR, 2 * eps, hD - hU).normalize();
    return n;
}

// Build terrain mesh
const terrainGeo = new THREE.PlaneGeometry(TERRAIN_SIZE, TERRAIN_SIZE, TERRAIN_SEG, TERRAIN_SEG);
terrainGeo.rotateX(-Math.PI / 2);

const positions = terrainGeo.attributes.position;
const colors = new Float32Array(positions.count * 3);

for (let i = 0; i < positions.count; i++) {
    const x = positions.getX(i);
    const z = positions.getZ(i);
    const y = getTerrainHeight(x, z);
    positions.setY(i, y);

    // Vertex colors based on height + slope
    const slope = 1 - getTerrainNormal(x, z).y; // 0 = flat, 1 = vertical
    const t = Math.min(y / TERRAIN_HEIGHT, 1);

    // Green meadow -> brown dirt -> grey rock
    let r, g, b;
    if (t < 0.3) {
        // Low: lush green
        r = 0.22 + slope * 0.15;
        g = 0.50 + fbm(x * 0.3, z * 0.3, 2) * 0.15;
        b = 0.12;
    } else if (t < 0.6) {
        // Mid: yellow-green
        const f = (t - 0.3) / 0.3;
        r = 0.22 + f * 0.3;
        g = 0.50 - f * 0.1;
        b = 0.12 + f * 0.05;
    } else {
        // High: brown/rocky
        const f = (t - 0.6) / 0.4;
        r = 0.45 + f * 0.15;
        g = 0.38 - f * 0.1;
        b = 0.20 + f * 0.1;
    }
    colors[i * 3] = r;
    colors[i * 3 + 1] = g;
    colors[i * 3 + 2] = b;
}

terrainGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
terrainGeo.computeVertexNormals();

const terrainMat = new THREE.MeshBasicMaterial({ vertexColors: true });
const terrain = new THREE.Mesh(terrainGeo, terrainMat);
scene.add(terrain);

// --- Obstacles (rocks and trees register as collision objects) ---
const obstacles = []; // { position: Vector3, radius: number }

// --- Load helpers ---
const loader = new GLTFLoader();
const clock = new THREE.Clock();
const rand = (min, max) => min + Math.random() * (max - min);

const boids = [];
const BOUNDS = 18;

const BOID = {
    separationDist: 3.0,
    separationWeight: 2.5,
    alignmentDist: 8.0,
    alignmentWeight: 0.8,
    cohesionDist: 12.0,
    cohesionWeight: 0.6,
    boundaryWeight: 1.5,
    wanderWeight: 0.4,
    maxSpeed: 3.0,
    maxForce: 1.5,
    fleeDistance: 8.0,
    fleeWeight: 4.0,
    chaseWeight: 1.2,
    chaseDistance: 15.0,
    obstacleAvoidDist: 3.0,
    obstacleRepulsion: 4.0,
    slopeThreshold: 0.2,
};

// Reusable Vector3s to avoid per-frame allocations
const _v1 = new THREE.Vector3();
const _v2 = new THREE.Vector3();
const _v3 = new THREE.Vector3();

class Boid {
    constructor(model, mixer, type = 'deer') {
        this.model = model;
        this.mixer = mixer;
        this.type = type;
        this.velocity = new THREE.Vector3(rand(-1, 1), 0, rand(-1, 1)).normalize().multiplyScalar(1.5);
        this.acceleration = new THREE.Vector3();
        this.maxSpeed = type === 'fox' ? BOID.maxSpeed * 1.4 : BOID.maxSpeed;
        this.maxForce = BOID.maxForce;
        this.wanderAngle = rand(0, Math.PI * 2);
        // Cached terrain data (computed once per frame in update)
        this._normal = new THREE.Vector3();
    }

    seek(target, out) {
        out.subVectors(target, this.model.position);
        out.y = 0;
        out.normalize().multiplyScalar(this.maxSpeed).sub(this.velocity);
        out.clampLength(0, this.maxForce);
        return out;
    }

    // Single-pass neighbor computation: separation + alignment + cohesion + flee/chase
    computeFlocking(allBoids) {
        const sepSteer = _v1.set(0, 0, 0);
        const avgVel = _v2.set(0, 0, 0);
        const center = _v3.set(0, 0, 0);
        let sepCount = 0, alignCount = 0, cohereCount = 0;
        let nearestDeer = null, nearestDeerDist = Infinity;

        for (const other of allBoids) {
            if (other === this) continue;
            const dx = this.model.position.x - other.model.position.x;
            const dz = this.model.position.z - other.model.position.z;
            const d = Math.sqrt(dx * dx + dz * dz);

            // Separation (all types)
            if (d > 0 && d < BOID.separationDist) {
                sepSteer.x += (dx / d) / d;
                sepSteer.z += (dz / d) / d;
                sepCount++;
            }

            if (this.type === 'fox') {
                // Track nearest deer for chasing
                if (other.type === 'deer' && d < nearestDeerDist) {
                    nearestDeerDist = d;
                    nearestDeer = other;
                }
            } else {
                // Deer flocking (same-type only)
                if (other.type === this.type) {
                    if (d > 0 && d < BOID.alignmentDist) {
                        avgVel.x += other.velocity.x;
                        avgVel.z += other.velocity.z;
                        alignCount++;
                    }
                    if (d > 0 && d < BOID.cohesionDist) {
                        center.x += other.model.position.x;
                        center.z += other.model.position.z;
                        cohereCount++;
                    }
                }
                // Flee from foxes
                if (other.type === 'fox' && d < BOID.fleeDistance) {
                    const fleeMult = BOID.fleeWeight * (1 - d / BOID.fleeDistance);
                    this.acceleration.x += (dx / d) * fleeMult;
                    this.acceleration.z += (dz / d) * fleeMult;
                }
            }
        }

        // Apply separation
        if (sepCount > 0) {
            sepSteer.divideScalar(sepCount).normalize().multiplyScalar(this.maxSpeed).sub(this.velocity);
            sepSteer.clampLength(0, this.maxForce);
            this.acceleration.x += sepSteer.x * BOID.separationWeight;
            this.acceleration.z += sepSteer.z * BOID.separationWeight;
        }

        if (this.type === 'fox') {
            if (nearestDeer && nearestDeerDist < BOID.chaseDistance) {
                this.seek(nearestDeer.model.position, _v1);
                this.acceleration.x += _v1.x * BOID.chaseWeight;
                this.acceleration.z += _v1.z * BOID.chaseWeight;
            } else {
                this.wanderAngle += rand(-0.3, 0.3);
                this.acceleration.x += Math.cos(this.wanderAngle) * BOID.wanderWeight;
                this.acceleration.z += Math.sin(this.wanderAngle) * BOID.wanderWeight;
            }
        } else {
            // Apply alignment
            if (alignCount > 0) {
                avgVel.divideScalar(alignCount).normalize().multiplyScalar(this.maxSpeed).sub(this.velocity);
                avgVel.clampLength(0, this.maxForce);
                this.acceleration.x += avgVel.x * BOID.alignmentWeight;
                this.acceleration.z += avgVel.z * BOID.alignmentWeight;
            }
            // Apply cohesion
            if (cohereCount > 0) {
                center.divideScalar(cohereCount);
                this.seek(center, _v1);
                this.acceleration.x += _v1.x * BOID.cohesionWeight;
                this.acceleration.z += _v1.z * BOID.cohesionWeight;
            }
            // Wander
            this.wanderAngle += rand(-0.3, 0.3);
            this.acceleration.x += Math.cos(this.wanderAngle) * BOID.wanderWeight;
            this.acceleration.z += Math.sin(this.wanderAngle) * BOID.wanderWeight;
        }
    }

    update(delta, allBoids) {
        this.acceleration.set(0, 0, 0);
        const pos = this.model.position;

        // Single-pass flocking
        this.computeFlocking(allBoids);

        // Boundaries
        const limit = BOUNDS - 3;
        if (pos.x > limit) this.acceleration.x -= BOID.boundaryWeight;
        if (pos.x < -limit) this.acceleration.x += BOID.boundaryWeight;
        if (pos.z > limit) this.acceleration.z -= BOID.boundaryWeight;
        if (pos.z < -limit) this.acceleration.z += BOID.boundaryWeight;

        // Obstacle avoidance
        for (const obs of obstacles) {
            const dx = pos.x - obs.position.x;
            const dz = pos.z - obs.position.z;
            const d = Math.sqrt(dx * dx + dz * dz);
            const minDist = obs.radius + BOID.obstacleAvoidDist;
            if (d < minDist && d > 0.01) {
                const strength = (1 - d / minDist) * BOID.obstacleRepulsion;
                this.acceleration.x += (dx / d) * strength;
                this.acceleration.z += (dz / d) * strength;
            }
        }

        // Terrain: compute normal ONCE, reuse for slope force + slowdown + tilt
        const normal = this._normal;
        normal.copy(getTerrainNormal(pos.x, pos.z));

        // Slope force: push downhill on steep terrain
        const steepness = Math.sqrt(normal.x * normal.x + normal.z * normal.z);
        if (steepness > BOID.slopeThreshold) {
            this.acceleration.x += (-normal.x / steepness) * steepness * 2;
            this.acceleration.z += (-normal.z / steepness) * steepness * 2;
        }

        // Integrate velocity
        this.velocity.x += this.acceleration.x * delta;
        this.velocity.z += this.acceleration.z * delta;
        this.velocity.y = 0;
        const slopeSlowdown = Math.max(0.3, normal.y);
        this.velocity.clampLength(0, this.maxSpeed * slopeSlowdown);

        // Move
        pos.x += this.velocity.x * delta;
        pos.z += this.velocity.z * delta;
        pos.y = getTerrainHeight(pos.x, pos.z);

        // Tilt to terrain slope
        const vLen = this.velocity.length();
        if (vLen > 0.1) {
            const slopePitch = -Math.asin((normal.x * this.velocity.x + normal.z * this.velocity.z) / vLen) * 0.5;
            this.model.rotation.x = slopePitch;

            // Smooth rotation towards movement direction
            const targetAngle = Math.atan2(this.velocity.x, this.velocity.z);
            let diff = targetAngle - this.model.rotation.y;
            if (diff > Math.PI) diff -= Math.PI * 2;
            if (diff < -Math.PI) diff += Math.PI * 2;
            this.model.rotation.y += diff * Math.min(delta * 5, 1);
        }

        if (this.mixer) this.mixer.update(delta * 1.5);
    }
}

function convertToBasicMaterials(model, fallbackColor = 0xcccccc) {
    model.traverse((child) => {
        if (!child.isMesh || !child.material) return;
        const oldMat = child.material;
        child.material = new THREE.MeshBasicMaterial({
            color: oldMat.color ? oldMat.color.clone() : new THREE.Color(fallbackColor),
        });
        oldMat.dispose();
    });
}

function loadBoid(url, position, scale, animName, type) {
    position.y = getTerrainHeight(position.x, position.z);
    loader.load(url, (gltf) => {
        const model = gltf.scene;
        model.position.copy(position);
        model.scale.setScalar(scale);
        convertToBasicMaterials(model);
        scene.add(model);

        const mixer = new THREE.AnimationMixer(model);
        const clip = gltf.animations.find(a => a.name.includes(animName));
        if (clip) {
            const action = mixer.clipAction(clip);
            action.timeScale = 1.5;
            action.play();
        }
        boids.push(new Boid(model, mixer, type));
    });
}

function loadNature(url, position, rotY, scale, collisionRadius = 0) {
    position.y = getTerrainHeight(position.x, position.z);
    if (collisionRadius > 0) {
        obstacles.push({ position: position.clone(), radius: collisionRadius });
    }
    loader.load(url, (gltf) => {
        const model = gltf.scene;
        model.position.copy(position);
        model.rotation.y = rotY;
        model.scale.setScalar(scale);
        convertToBasicMaterials(model, 0x55aa33);
        scene.add(model);
    });
}
const natBase = 'models/nature/';

// Trees — register as collision obstacles
for (let i = 0; i < 8; i++) {
    const angle = (i / 8) * Math.PI * 2;
    const r = 18 + rand(-3, 3);
    loadNature(natBase + 'CommonTree_1.glb', new THREE.Vector3(Math.cos(angle)*r, 0, Math.sin(angle)*r), rand(0, 6.28), rand(1.5, 2.5), 1.5);
}
for (let i = 0; i < 5; i++) {
    const angle = (i / 5) * Math.PI * 2 + 0.3;
    const r = 22 + rand(-2, 2);
    loadNature(natBase + 'PineTree_1.glb', new THREE.Vector3(Math.cos(angle)*r, 0, Math.sin(angle)*r), rand(0, 6.28), rand(2, 3), 1.2);
}
for (let i = 0; i < 3; i++) {
    loadNature(natBase + 'BirchTree_1.glb', new THREE.Vector3(rand(-15, -8), 0, rand(-5, 5)), rand(0, 6.28), rand(1.5, 2.2), 1.0);
}
// Grass, flowers — no collision
for (let i = 0; i < 20; i++) {
    loadNature(natBase + 'Grass.glb', new THREE.Vector3(rand(-12, 12), 0, rand(-12, 12)), rand(0, 6.28), rand(0.8, 1.5));
}
for (let i = 0; i < 10; i++) {
    loadNature(natBase + 'Bush_1.glb', new THREE.Vector3(rand(-15, 15), 0, rand(-15, 15)), rand(0, 6.28), rand(1, 1.5), 0.8);
}
for (let i = 0; i < 8; i++) {
    loadNature(natBase + 'Flowers.glb', new THREE.Vector3(rand(-10, 10), 0, rand(-10, 10)), rand(0, 6.28), rand(0.6, 1.2));
}
// Rocks — solid obstacles
for (let i = 0; i < 5; i++) {
    loadNature(natBase + ['Rock_1.glb', 'Rock_Moss_1.glb'][i % 2], new THREE.Vector3(rand(-15, 15), 0, rand(-15, 15)), rand(0, 6.28), rand(1.5, 3), 1.5);
}

// --- Spawn boids ---
const animalBase = 'models/animals/';

// Deer herd (5 deer that flock together)
for (let i = 0; i < 5; i++) {
    const angle = rand(0, Math.PI * 2);
    const r = rand(2, 6);
    loadBoid(animalBase + 'Deer.glb',
        new THREE.Vector3(Math.cos(angle) * r, 0, Math.sin(angle) * r),
        rand(0.9, 1.1), 'Walk', 'deer');
}

// Stag pair
for (let i = 0; i < 2; i++) {
    loadBoid(animalBase + 'Stag.glb',
        new THREE.Vector3(rand(-8, -4), 0, rand(-6, 6)),
        rand(1.1, 1.3), 'Walk', 'deer');
}

// Fox — the predator
loadBoid(animalBase + 'Fox.glb',
    new THREE.Vector3(12, 0, 0),
    0.8, 'Gallop', 'fox');

// ─── Weather System ───
const weather = {
    state: 'clear',       // clear, cloudy, rain, storm, fog, golden_hour
    transition: 0,        // 0..1 blend factor
    targetAmbient: new THREE.Color(0x8899aa),
    targetSun: new THREE.Color(0xffeedd),
    targetSunIntensity: 0.5,
    targetAmbientIntensity: 0.6,
    targetFog: null,
    windX: 0,
    windZ: 0,
};

const ambientLight = scene.children.find(c => c.isAmbientLight);

// Rain particles
const rainGeo = new THREE.BufferGeometry();
const rainCount = 3000;
const rainPositions = new Float32Array(rainCount * 3);
for (let i = 0; i < rainCount; i++) {
    rainPositions[i * 3] = rand(-30, 30);
    rainPositions[i * 3 + 1] = rand(0, 25);
    rainPositions[i * 3 + 2] = rand(-30, 30);
}
rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPositions, 3));
const rainMat = new THREE.PointsMaterial({ color: 0xaaccee, size: 0.08, transparent: true, opacity: 0 });
const rain = new THREE.Points(rainGeo, rainMat);
scene.add(rain);

function setWeather(state) {
    weather.state = state;
    weather.transition = 0;
    const toast = document.getElementById('event-toast');

    switch (state) {
        case 'clear':
            weather.targetAmbient.set(0x8899aa);
            weather.targetSun.set(0xffeedd);
            weather.targetSunIntensity = 0.5;
            weather.targetAmbientIntensity = 0.6;
            weather.targetFog = null;
            weather.windX = 0; weather.windZ = 0;
            toast.textContent = '☀️ Clear skies';
            break;
        case 'cloudy':
            weather.targetAmbient.set(0x778899);
            weather.targetSun.set(0xcccccc);
            weather.targetSunIntensity = 0.2;
            weather.targetAmbientIntensity = 0.7;
            weather.targetFog = null;
            weather.windX = rand(-0.3, 0.3); weather.windZ = rand(-0.3, 0.3);
            toast.textContent = '☁️ Clouds rolling in';
            break;
        case 'rain':
            weather.targetAmbient.set(0x556677);
            weather.targetSun.set(0x889999);
            weather.targetSunIntensity = 0.1;
            weather.targetAmbientIntensity = 0.5;
            weather.targetFog = new THREE.Color(0x667788);
            weather.windX = rand(-0.8, 0.8); weather.windZ = rand(-0.8, 0.8);
            toast.textContent = '🌧️ Rain begins to fall';
            break;
        case 'storm':
            weather.targetAmbient.set(0x334455);
            weather.targetSun.set(0x556666);
            weather.targetSunIntensity = 0.05;
            weather.targetAmbientIntensity = 0.4;
            weather.targetFog = new THREE.Color(0x445566);
            weather.windX = rand(-2, 2); weather.windZ = rand(-2, 2);
            toast.textContent = '⛈️ A storm approaches!';
            break;
        case 'fog':
            weather.targetAmbient.set(0x99aabb);
            weather.targetSun.set(0xdddddd);
            weather.targetSunIntensity = 0.15;
            weather.targetAmbientIntensity = 0.8;
            weather.targetFog = new THREE.Color(0xbbcccc);
            weather.windX = 0; weather.windZ = 0;
            toast.textContent = '🌫️ Fog descends on the meadow';
            break;
        case 'golden_hour':
            weather.targetAmbient.set(0xcc8855);
            weather.targetSun.set(0xffaa44);
            weather.targetSunIntensity = 0.7;
            weather.targetAmbientIntensity = 0.5;
            weather.targetFog = null;
            weather.windX = 0; weather.windZ = 0;
            toast.textContent = '🌅 Golden hour';
            break;
    }
    toast.style.opacity = '1';
    setTimeout(() => { toast.style.opacity = '0'; }, 3000);
}

function updateWeather(delta) {
    weather.transition = Math.min(weather.transition + delta * 0.3, 1);
    const t = weather.transition;

    ambientLight.color.lerp(weather.targetAmbient, t * 0.05);
    ambientLight.intensity += (weather.targetAmbientIntensity - ambientLight.intensity) * t * 0.05;
    sun.color.lerp(weather.targetSun, t * 0.05);
    sun.intensity += (weather.targetSunIntensity - sun.intensity) * t * 0.05;

    // Fog
    if (weather.targetFog) {
        if (!scene.fog) scene.fog = new THREE.Fog(weather.targetFog, 15, 50);
        scene.fog.color.lerp(weather.targetFog, t * 0.05);
        scene.fog.near += (15 - scene.fog.near) * 0.02;
        const targetFar = weather.state === 'fog' ? 30 : weather.state === 'storm' ? 35 : 50;
        scene.fog.far += (targetFar - scene.fog.far) * 0.02;
    } else if (scene.fog) {
        scene.fog.far += (200 - scene.fog.far) * 0.02;
        if (scene.fog.far > 180) scene.fog = null;
    }

    // Rain particles
    const isRaining = weather.state === 'rain' || weather.state === 'storm';
    const targetOpacity = isRaining ? (weather.state === 'storm' ? 0.7 : 0.4) : 0;
    rainMat.opacity += (targetOpacity - rainMat.opacity) * 0.03;

    if (rainMat.opacity > 0.01) {
        const positions = rainGeo.attributes.position;
        const speed = weather.state === 'storm' ? 40 : 20;
        for (let i = 0; i < rainCount; i++) {
            positions.array[i * 3 + 1] -= delta * speed;
            positions.array[i * 3] += weather.windX * delta * 3;
            positions.array[i * 3 + 2] += weather.windZ * delta * 3;
            if (positions.array[i * 3 + 1] < 0) {
                positions.array[i * 3] = rand(-30, 30);
                positions.array[i * 3 + 1] = rand(15, 25);
                positions.array[i * 3 + 2] = rand(-30, 30);
            }
        }
        positions.needsUpdate = true;
    }

    // Update sky gradient based on weather
    const skyGrad = ctx.createLinearGradient(0, 0, 0, 512);
    if (weather.state === 'storm') {
        skyGrad.addColorStop(0, '#223344'); skyGrad.addColorStop(1, '#334455');
    } else if (weather.state === 'rain') {
        skyGrad.addColorStop(0, '#446688'); skyGrad.addColorStop(1, '#667788');
    } else if (weather.state === 'fog') {
        skyGrad.addColorStop(0, '#8899aa'); skyGrad.addColorStop(1, '#aabbbb');
    } else if (weather.state === 'golden_hour') {
        skyGrad.addColorStop(0, '#cc6633'); skyGrad.addColorStop(0.5, '#dd9955');
        skyGrad.addColorStop(1, '#eebb77');
    } else if (weather.state === 'cloudy') {
        skyGrad.addColorStop(0, '#5577aa'); skyGrad.addColorStop(1, '#99aabb');
    } else {
        skyGrad.addColorStop(0, '#4488cc'); skyGrad.addColorStop(0.4, '#7ab0dd');
        skyGrad.addColorStop(0.7, '#b8d8e8'); skyGrad.addColorStop(1, '#d8e8d0');
    }
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, 2, 512);
    scene.background.needsUpdate = true;
}

// ─── Hunter (cartoonish figure built from primitives) ───
const hunter = {
    group: null,
    active: false,
    position: new THREE.Vector3(),
    velocity: new THREE.Vector3(),
    fleeDir: new THREE.Vector3(),
    hp: 1.0,       // confidence — drops when animals attack
    timer: 0,
    wobble: 0,     // panic wobble animation
};

function createHunter() {
    const g = new THREE.Group();

    // Boots (dark brown)
    const bootMat = new THREE.MeshBasicMaterial({ color: 0x3a2510 });
    const bootL = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.2, 0.35), bootMat);
    bootL.position.set(-0.15, 0.1, 0.05);
    g.add(bootL);
    const bootR = bootL.clone();
    bootR.position.set(0.15, 0.1, 0.05);
    g.add(bootR);

    // Legs (khaki)
    const legMat = new THREE.MeshBasicMaterial({ color: 0x8b7d5a });
    const legL = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 0.6, 8), legMat);
    legL.position.set(-0.15, 0.5, 0);
    g.add(legL);
    const legR = legL.clone();
    legR.position.set(0.15, 0.5, 0);
    g.add(legR);

    // Body (olive vest over red flannel)
    const bodyMat = new THREE.MeshBasicMaterial({ color: 0x5a6b3a });
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.6, 0.3), bodyMat);
    body.position.set(0, 1.1, 0);
    g.add(body);
    // Red flannel peeking out
    const flannelMat = new THREE.MeshBasicMaterial({ color: 0xcc3333 });
    const flannel = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.15, 0.25), flannelMat);
    flannel.position.set(0, 0.78, 0);
    g.add(flannel);

    // Arms (khaki sleeves)
    const armL = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.07, 0.5, 8), legMat);
    armL.position.set(-0.35, 1.05, 0);
    armL.rotation.z = 0.3;
    armL.name = 'armL';
    g.add(armL);
    const armR = armL.clone();
    armR.position.set(0.35, 1.05, 0);
    armR.rotation.z = -0.3;
    armR.name = 'armR';
    g.add(armR);

    // Head (peach skin)
    const headMat = new THREE.MeshBasicMaterial({ color: 0xf0c090 });
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.2, 12, 8), headMat);
    head.position.set(0, 1.6, 0);
    head.name = 'head';
    g.add(head);

    // Big silly hat (orange hunting cap)
    const hatMat = new THREE.MeshBasicMaterial({ color: 0xff6600 });
    const hat = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.25, 0.2, 12), hatMat);
    hat.position.set(0, 1.82, 0);
    g.add(hat);
    const brim = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.04, 12), hatMat);
    brim.position.set(0, 1.72, 0);
    g.add(brim);

    // Eyes (wide, scared-looking white circles with dots)
    const eyeWhiteMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 6), eyeWhiteMat);
    eyeL.position.set(-0.08, 1.63, 0.18);
    g.add(eyeL);
    const eyeR = eyeL.clone();
    eyeR.position.set(0.08, 1.63, 0.18);
    g.add(eyeR);
    const pupilMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
    const pupilL = new THREE.Mesh(new THREE.SphereGeometry(0.025, 6, 4), pupilMat);
    pupilL.position.set(-0.08, 1.63, 0.22);
    g.add(pupilL);
    const pupilR = pupilL.clone();
    pupilR.position.set(0.08, 1.63, 0.22);
    g.add(pupilR);

    // Cartoonish rifle (stick with a wider end)
    const gunMat = new THREE.MeshBasicMaterial({ color: 0x4a3520 });
    const gun = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.03, 1.0, 6), gunMat);
    gun.position.set(0.4, 1.1, 0.15);
    gun.rotation.z = -0.6;
    gun.rotation.x = 0.2;
    gun.name = 'gun';
    g.add(gun);

    // Mouth (small open 'O' when scared)
    const mouthMat = new THREE.MeshBasicMaterial({ color: 0x331111 });
    const mouth = new THREE.Mesh(new THREE.SphereGeometry(0.04, 8, 6), mouthMat);
    mouth.position.set(0, 1.53, 0.19);
    mouth.name = 'mouth';
    g.add(mouth);

    g.visible = false;
    scene.add(g);
    hunter.group = g;
}
createHunter();

function spawnHunter() {
    // Enter from a random edge
    const angle = rand(0, Math.PI * 2);
    const edge = BOUNDS + 3;
    hunter.position.set(Math.cos(angle) * edge, 0, Math.sin(angle) * edge);
    hunter.position.y = getTerrainHeight(hunter.position.x, hunter.position.z);
    hunter.group.position.copy(hunter.position);
    // Face toward center
    hunter.group.rotation.y = Math.atan2(-hunter.position.x, -hunter.position.z);
    hunter.velocity.set(-Math.cos(angle) * 1.5, 0, -Math.sin(angle) * 1.5);
    hunter.fleeDir.set(0, 0, 0);
    hunter.hp = 1.0;
    hunter.timer = 0;
    hunter.wobble = 0;
    hunter.active = true;
    hunter.group.visible = true;

    // Start walking in
    const toast = document.getElementById('event-toast');
    toast.textContent = '🔫 A hunter appears!';
    toast.style.opacity = '1';
    setTimeout(() => { toast.style.opacity = '0'; }, 3000);
}

function updateHunter(delta) {
    if (!hunter.active) return;
    hunter.timer += delta;

    const pos = hunter.position;
    const g = hunter.group;

    // Phase 1: Sneak toward center (first 3 seconds)
    // Phase 2: Animals detect and charge, hunter panics
    // Phase 3: Hunter flees off-map

    // Check if any animal is close enough to "see" the hunter
    let nearestAnimalDist = Infinity;
    let attackerCount = 0;
    const detectionRange = 10;
    const attackRange = 4;

    for (const boid of boids) {
        const dx = pos.x - boid.model.position.x;
        const dz = pos.z - boid.model.position.z;
        const d = Math.sqrt(dx * dx + dz * dz);

        if (d < detectionRange) {
            // Animal spotted the hunter — charge at them!
            const chargeForce = 6.0 * (1 - d / detectionRange);
            boid.acceleration.x -= (dx / d) * chargeForce;
            boid.acceleration.z -= (dz / d) * chargeForce;
            boid.maxSpeed = Math.max(boid.maxSpeed, BOID.maxSpeed * 1.8);

            if (d < attackRange) {
                attackerCount++;
                // Headbutt! Reduce hunter confidence
                hunter.hp -= delta * 0.4;
            }
        }
        if (d < nearestAnimalDist) nearestAnimalDist = d;
    }

    // Hunter behavior based on confidence
    if (hunter.hp < 0.7 || attackerCount > 0) {
        // PANIC — flee away from animals
        hunter.wobble += delta * 15;
        g.rotation.z = Math.sin(hunter.wobble) * 0.2;

        // Mouth gets bigger with panic
        const mouth = g.getObjectByName('mouth');
        if (mouth) mouth.scale.setScalar(1 + (1 - hunter.hp) * 2);

        // Arms flail
        const armL = g.getObjectByName('armL');
        const armR = g.getObjectByName('armR');
        if (armL) armL.rotation.z = 0.3 + Math.sin(hunter.wobble * 1.3) * 0.8;
        if (armR) armR.rotation.z = -0.3 + Math.cos(hunter.wobble * 1.5) * 0.8;

        // Drop the gun when very scared
        const gun = g.getObjectByName('gun');
        if (gun && hunter.hp < 0.4) gun.visible = false;

        // Flee direction: away from nearest animal cluster
        hunter.fleeDir.set(0, 0, 0);
        for (const boid of boids) {
            const dx = pos.x - boid.model.position.x;
            const dz = pos.z - boid.model.position.z;
            const d = Math.sqrt(dx * dx + dz * dz);
            if (d < detectionRange && d > 0.1) {
                hunter.fleeDir.x += dx / (d * d);
                hunter.fleeDir.z += dz / (d * d);
            }
        }
        if (hunter.fleeDir.length() > 0.01) {
            hunter.fleeDir.normalize();
        } else {
            // Just run away from center
            hunter.fleeDir.set(pos.x, 0, pos.z).normalize();
        }

        // Accelerating flee
        const fleeSpeed = 3 + (1 - hunter.hp) * 5;
        hunter.velocity.x += (hunter.fleeDir.x * fleeSpeed - hunter.velocity.x) * delta * 3;
        hunter.velocity.z += (hunter.fleeDir.z * fleeSpeed - hunter.velocity.z) * delta * 3;

        // Face flee direction
        g.rotation.y = Math.atan2(hunter.fleeDir.x, hunter.fleeDir.z);

        // Toast when first panicking
        if (hunter.hp < 0.7 && hunter.hp > 0.65) {
            const toast = document.getElementById('event-toast');
            toast.textContent = '😱 The animals attack! Hunter panics!';
            toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, 3000);
        }
    } else {
        // Sneaking in — slow walk toward center
        const toCenter = Math.sqrt(pos.x * pos.x + pos.z * pos.z);
        if (toCenter > 2) {
            hunter.velocity.x = (-pos.x / toCenter) * 1.2;
            hunter.velocity.z = (-pos.z / toCenter) * 1.2;
            g.rotation.y = Math.atan2(-pos.x, -pos.z);
        } else {
            hunter.velocity.set(0, 0, 0);
        }
        // Sneaking walk wobble
        hunter.wobble += delta * 4;
        g.rotation.z = Math.sin(hunter.wobble) * 0.03;
    }

    // Move
    pos.x += hunter.velocity.x * delta;
    pos.z += hunter.velocity.z * delta;
    pos.y = getTerrainHeight(pos.x, pos.z);
    g.position.copy(pos);

    // Leg animation (simple bob)
    g.position.y += Math.abs(Math.sin(hunter.wobble * 0.8)) * 0.05;

    // Remove when fled far enough or confidence gone
    const distFromCenter = Math.sqrt(pos.x * pos.x + pos.z * pos.z);
    if ((hunter.hp <= 0 && distFromCenter > BOUNDS) || distFromCenter > BOUNDS + 15) {
        hunter.active = false;
        hunter.group.visible = false;
        // Reset gun visibility
        const gun = g.getObjectByName('gun');
        if (gun) gun.visible = true;
        // Reset mouth
        const mouth = g.getObjectByName('mouth');
        if (mouth) mouth.scale.setScalar(1);
        // Reset animal speeds
        for (const b of boids) {
            b.maxSpeed = b.type === 'fox' ? BOID.maxSpeed * 1.4 : BOID.maxSpeed;
        }
        const toast = document.getElementById('event-toast');
        toast.textContent = '🏃 The hunter flees! The meadow is safe.';
        toast.style.opacity = '1';
        setTimeout(() => { toast.style.opacity = '0'; }, 3000);
    }
}

// ─── Random Events ───
let nextEventTime = 5;
const EVENT_INTERVAL_MIN = 8;
const EVENT_INTERVAL_MAX = 20;

let lightningTimer = 0;
const lightningLight = new THREE.PointLight(0xffffff, 0, 100);
lightningLight.position.set(0, 30, 0);
scene.add(lightningLight);

function triggerEvent() {
    const toast = document.getElementById('event-toast');
    const eventPool = [];

    // Weather changes
    const weatherOptions = ['clear', 'cloudy', 'rain', 'storm', 'fog', 'golden_hour']
        .filter(w => w !== weather.state);
    eventPool.push({ type: 'weather', weather: weatherOptions[Math.floor(rand(0, weatherOptions.length))] });

    // Animal behavior events
    if (boids.length > 0) {
        eventPool.push({ type: 'stampede' });
        eventPool.push({ type: 'grazing_halt' });
        eventPool.push({ type: 'fox_frenzy' });
        eventPool.push({ type: 'scatter' });
        if (!hunter.active) {
            eventPool.push({ type: 'hunter' });
            eventPool.push({ type: 'hunter' }); // double weight — more likely
        }
    }

    const event = eventPool[Math.floor(rand(0, eventPool.length))];

    switch (event.type) {
        case 'weather':
            setWeather(event.weather);
            break;

        case 'stampede': {
            // All deer suddenly run in one direction
            const angle = rand(0, Math.PI * 2);
            const dir = { x: Math.cos(angle), z: Math.sin(angle) };
            for (const b of boids) {
                if (b.type === 'deer') {
                    b.velocity.x = dir.x * b.maxSpeed * 1.5;
                    b.velocity.z = dir.z * b.maxSpeed * 1.5;
                }
            }
            toast.textContent = '🦌 The herd stampedes!';
            toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, 3000);
            break;
        }

        case 'grazing_halt': {
            // Deer stop to graze
            for (const b of boids) {
                if (b.type === 'deer') {
                    b.velocity.multiplyScalar(0.05);
                    b._grazeTimer = rand(3, 6);
                    // Switch to eating animation if available
                    if (b.mixer) {
                        const eating = b.mixer._root?.animations?.find(a => a.name.includes('Eating'));
                        if (eating) {
                            b.mixer.clipAction(eating).reset().setLoop(THREE.LoopRepeat).play();
                        }
                    }
                }
            }
            toast.textContent = '🌿 The herd stops to graze';
            toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, 3000);
            break;
        }

        case 'fox_frenzy': {
            // Fox goes into a sprint burst
            for (const b of boids) {
                if (b.type === 'fox') {
                    b.maxSpeed = BOID.maxSpeed * 2.5;
                    setTimeout(() => { b.maxSpeed = BOID.maxSpeed * 1.4; }, 4000);
                }
            }
            toast.textContent = '🦊 The fox charges!';
            toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, 3000);
            break;
        }

        case 'hunter': {
            spawnHunter();
            break;
        }

        case 'scatter': {
            // All animals scatter from center
            for (const b of boids) {
                const dx = b.model.position.x;
                const dz = b.model.position.z;
                const d = Math.sqrt(dx * dx + dz * dz) || 1;
                b.velocity.x = (dx / d) * b.maxSpeed * 1.5;
                b.velocity.z = (dz / d) * b.maxSpeed * 1.5;
            }
            toast.textContent = '💨 Something spooks the animals!';
            toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, 3000);
            break;
        }
    }
}

// ─── Animation Loop ───
let autoOrbit = true;
let speedMultiplier = 1.5;

function animate() {
    requestAnimationFrame(animate);
    const rawDelta = clock.getDelta();
    const delta = rawDelta * speedMultiplier;
    const elapsed = clock.elapsedTime;

    // Weather
    updateWeather(delta);

    // Lightning during storms
    if (weather.state === 'storm') {
        lightningTimer -= delta;
        if (lightningTimer <= 0) {
            lightningLight.intensity = rand(3, 8);
            lightningLight.position.set(rand(-15, 15), 25, rand(-15, 15));
            lightningTimer = rand(1, 6);
            setTimeout(() => { lightningLight.intensity = 0; }, 100);
        }
    } else {
        lightningLight.intensity = 0;
    }

    // Random events
    nextEventTime -= rawDelta;
    if (nextEventTime <= 0) {
        triggerEvent();
        nextEventTime = rand(EVENT_INTERVAL_MIN, EVENT_INTERVAL_MAX);
    }

    // Hunter
    updateHunter(delta);

    // Wind effect on boids
    for (const boid of boids) {
        boid.acceleration.x += weather.windX * 0.3;
        boid.acceleration.z += weather.windZ * 0.3;
        // Grazing slowdown
        if (boid._grazeTimer > 0) {
            boid._grazeTimer -= delta;
            boid.velocity.multiplyScalar(0.9);
        }
        boid.update(delta, boids);
    }

    // Auto orbit camera — follow terrain height
    if (autoOrbit) {
        const t = elapsed * 0.12;
        const radius = 25;
        const cx = Math.cos(t) * radius;
        const cz = Math.sin(t) * radius;
        const camY = getTerrainHeight(cx, cz) + 10 + Math.sin(t * 0.5) * 3;
        camera.position.set(cx, camY, cz);
        controls.target.set(0, 2, 0);
    }

    controls.update();
    renderer.render(scene, camera);
}

animate();

// --- UI ---
document.getElementById('btn-spin').addEventListener('click', (e) => {
    autoOrbit = !autoOrbit;
    e.target.classList.toggle('active', autoOrbit);
});

const speeds = [1.5, 2.5, 1, 0.5];
let speedIdx = 0;
document.getElementById('btn-speed').addEventListener('click', (e) => {
    speedIdx = (speedIdx + 1) % speeds.length;
    speedMultiplier = speeds[speedIdx];
    e.target.textContent = `Speed: ${speedMultiplier}x`;
});

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

setTimeout(() => { document.getElementById('info').style.opacity = '0'; }, 5000);
</script>
