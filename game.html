<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
        "yuka": "https://cdn.jsdelivr.net/npm/yuka@0.7.8/build/yuka.module.js"
    }
}
</script>
<script type="module">
import * as THREE from 'three';
import * as YUKA from 'yuka';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const BUILD = 4;


const BOUNDS = 18;

function rand(min, max) {
    return min + Math.random() * (max - min);
}

function convertToBasicMaterials(model, fallback = 0xcccccc) {
    model.traverse((child) => {
        if (!child.isMesh || !child.material) return;
        const old = child.material;
        child.material = new THREE.MeshBasicMaterial({
            color: old.color ? old.color.clone() : new THREE.Color(fallback),
        });
        old.dispose();
    });
}

let _toastEl = null;
let _toastTimeout = null;

function showToast(text) {
    if (!_toastEl) _toastEl = document.getElementById('event-toast');
    if (!_toastEl) return;
    _toastEl.textContent = text;
    _toastEl.style.opacity = '1';
    clearTimeout(_toastTimeout);
    _toastTimeout = setTimeout(() => { _toastEl.style.opacity = '0'; }, 3000);
}


// Value noise with smoothstep interpolation
function hashNoise(x, z) {
    let n = Math.sin(x * 127.1 + z * 311.7) * 43758.5453;
    return n - Math.floor(n);
}

function valueNoise(x, z) {
    const ix = Math.floor(x), iz = Math.floor(z);
    const fx = x - ix, fz = z - iz;
    const sx = fx * fx * (3 - 2 * fx), sz = fz * fz * (3 - 2 * fz);
    const a = hashNoise(ix, iz), b = hashNoise(ix + 1, iz);
    const c = hashNoise(ix, iz + 1), d = hashNoise(ix + 1, iz + 1);
    return a + (b - a) * sx + (c - a) * sz + (a - b - c + d) * sx * sz;
}

function fbm(x, z, octaves = 4) {
    let val = 0, amp = 1, freq = 1, total = 0;
    for (let i = 0; i < octaves; i++) {
        val += valueNoise(x * freq, z * freq) * amp;
        total += amp;
        amp *= 0.5;
        freq *= 2;
    }
    return val / total;
}

const SIZE = 80;
const SEGMENTS = 150;
const MAX_HEIGHT = 10.0;
const SCALE = 0.06;
const ISLAND_RADIUS = 22;
const OCEAN_LEVEL = -1.5;

function getHeight(x, z) {
    const h = fbm(x * SCALE + 50, z * SCALE + 50, 5);
    const ridge = Math.exp(-((x + 12) ** 2) / 30) * 3.0;
    const valley = -Math.exp(-(z * z) / 60) * 1.5;
    const dist = Math.sqrt(x * x + z * z);

    // Island shape: smooth falloff at edges into ocean
    const islandFactor = 1 - smoothstep(Math.max((dist - ISLAND_RADIUS) / 8, 0));
    const landHeight = (h * MAX_HEIGHT * Math.min(dist / 12, 1) + ridge + valley) * Math.min(dist / 12, 1);

    // Blend between land and ocean floor
    return landHeight * islandFactor + OCEAN_LEVEL * (1 - islandFactor);
}

function smoothstep(t) { return t * t * (3 - 2 * t); }

// Reusable vector for normal output
const _nrm = new THREE.Vector3();

function getNormal(x, z) {
    const eps = 0.3;
    const hL = getHeight(x - eps, z), hR = getHeight(x + eps, z);
    const hD = getHeight(x, z - eps), hU = getHeight(x, z + eps);
    return _nrm.set(hL - hR, 2 * eps, hD - hU).normalize();
}

function createMesh() {
    const geo = new THREE.PlaneGeometry(SIZE, SIZE, SEGMENTS, SEGMENTS);
    geo.rotateX(-Math.PI / 2);

    const pos = geo.attributes.position;
    const colors = new Float32Array(pos.count * 3);

    for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i), z = pos.getZ(i);
        const y = getHeight(x, z);
        pos.setY(i, y);

        const slope = 1 - getNormal(x, z).y;
        const t = Math.min(y / MAX_HEIGHT, 1);
        let r, g, b;

        // Below water: sandy ocean floor
        if (y < OCEAN_LEVEL + 0.3) {
            r = 0.15; g = 0.25; b = 0.35;
        } else if (y < 0.2) {
            // Beach/shore
            r = 0.7; g = 0.65; b = 0.45;
        } else if (t < 0.3) {
            r = 0.22 + slope * 0.15;
            g = 0.50 + fbm(x * 0.3, z * 0.3, 2) * 0.15;
            b = 0.12;
        } else if (t < 0.6) {
            const f = (t - 0.3) / 0.3;
            r = 0.22 + f * 0.3; g = 0.50 - f * 0.1; b = 0.12 + f * 0.05;
        } else {
            const f = (t - 0.6) / 0.4;
            r = 0.45 + f * 0.15; g = 0.38 - f * 0.1; b = 0.20 + f * 0.1;
        }
        colors[i * 3] = r; colors[i * 3 + 1] = g; colors[i * 3 + 2] = b;
    }

    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    geo.computeVertexNormals();

    const group = new THREE.Group();
    group.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ vertexColors: true })));

    // Ocean water plane
    const waterGeo = new THREE.PlaneGeometry(200, 200);
    waterGeo.rotateX(-Math.PI / 2);
    const waterMat = new THREE.MeshBasicMaterial({
        color: 0x2266aa,
        transparent: true,
        opacity: 0.7,
    });
    const water = new THREE.Mesh(waterGeo, waterMat);
    water.position.y = OCEAN_LEVEL + 0.05;
    group.add(water);

    return group;
}


// Sync a Yuka entity's transform to a Three.js mesh
function syncRenderComponent(entity, mesh) {
    mesh.position.x = entity.position.x;
    mesh.position.y = entity.position.y;
    mesh.position.z = entity.position.z;
    mesh.quaternion.x = entity.rotation.x;
    mesh.quaternion.y = entity.rotation.y;
    mesh.quaternion.z = entity.rotation.z;
    mesh.quaternion.w = entity.rotation.w;
}

function createDeer(entityManager, scene, loader, gltf, spawnPos) {
    const model = gltf.scene.clone();
    model.scale.setScalar(rand(0.9, 1.1));
    convertToBasicMaterials(model);
    scene.add(model);

    const vehicle = new YUKA.Vehicle();
    vehicle.position.set(spawnPos.x, getHeight(spawnPos.x, spawnPos.z), spawnPos.z);
    vehicle.maxSpeed = 3.0;
    vehicle.maxForce = 2.0;
    vehicle.mass = 1;
    vehicle.updateNeighborhood = true;
    vehicle.neighborhoodRadius = 12;
    vehicle.setRenderComponent(model, syncRenderComponent);
    vehicle._type = 'deer';
    vehicle._mixer = null;
    vehicle._grazeTimer = 0;

    if (gltf.animations.length > 0) {
        const mixer = new THREE.AnimationMixer(model);
        const walkClip = gltf.animations.find(a => a.name.includes('Walk'));
        if (walkClip) {
            const action = mixer.clipAction(walkClip);
            action.timeScale = 1.5;
            action.play();
        }
        vehicle._mixer = mixer;
        vehicle._animations = gltf.animations;
    }

    const wander = new YUKA.WanderBehavior();
    wander.jitter = 5;
    wander.radius = 3;
    wander.distance = 5;
    wander.weight = 0.5;
    vehicle.steering.add(wander);

    const separation = new YUKA.SeparationBehavior();
    separation.weight = 2.5;
    vehicle.steering.add(separation);

    const alignment = new YUKA.AlignmentBehavior();
    alignment.weight = 0.8;
    vehicle.steering.add(alignment);

    const cohesion = new YUKA.CohesionBehavior();
    cohesion.weight = 0.6;
    vehicle.steering.add(cohesion);

    entityManager.add(vehicle);
    return vehicle;
}

function createFox(entityManager, scene, loader, gltf, spawnPos) {
    const model = gltf.scene.clone();
    model.scale.setScalar(0.8);
    convertToBasicMaterials(model);
    scene.add(model);

    const vehicle = new YUKA.Vehicle();
    vehicle.position.set(spawnPos.x, getHeight(spawnPos.x, spawnPos.z), spawnPos.z);
    vehicle.maxSpeed = 4.2;
    vehicle.maxForce = 2.5;
    vehicle.mass = 1;
    vehicle.setRenderComponent(model, syncRenderComponent);
    vehicle._type = 'fox';
    vehicle._mixer = null;

    if (gltf.animations.length > 0) {
        const mixer = new THREE.AnimationMixer(model);
        const clip = gltf.animations.find(a => a.name.includes('Gallop'));
        if (clip) {
            const action = mixer.clipAction(clip);
            action.timeScale = 1.5;
            action.play();
        }
        vehicle._mixer = mixer;
        vehicle._animations = gltf.animations;
    }

    const wander = new YUKA.WanderBehavior();
    wander.jitter = 8;
    wander.radius = 4;
    wander.distance = 6;
    wander.weight = 0.3;
    vehicle.steering.add(wander);

    // Pursuit is added dynamically when a deer is targeted
    vehicle._pursuitBehavior = new YUKA.PursuitBehavior();
    vehicle._pursuitBehavior.weight = 1.2;
    vehicle._pursuitBehavior.active = false;
    vehicle.steering.add(vehicle._pursuitBehavior);

    entityManager.add(vehicle);
    return vehicle;
}

// Per-frame update: terrain following, boundary, fox targeting, grazing
function updateAnimals(entityManager, delta) {
    const entities = entityManager.entities;
    let nearestDeerToFox = null;
    let nearestDeerDist = Infinity;

    for (const entity of entities) {
        if (!entity._type || entity._playerControlled) continue;

        // Terrain following
        const pos = entity.position;
        pos.y = getHeight(pos.x, pos.z);

        // Boundary force
        const limit = BOUNDS - 3;
        if (pos.x > limit) entity.velocity.x -= 3 * delta;
        if (pos.x < -limit) entity.velocity.x += 3 * delta;
        if (pos.z > limit) entity.velocity.z -= 3 * delta;
        if (pos.z < -limit) entity.velocity.z += 3 * delta;

        // Slope slowdown
        const normal = getNormal(pos.x, pos.z);
        const slopeSlowdown = Math.max(0.3, normal.y);
        const speed = entity.velocity.length();
        if (speed > entity.maxSpeed * slopeSlowdown) {
            entity.velocity.normalize().multiplyScalar(entity.maxSpeed * slopeSlowdown);
        }

        // Animation mixer
        if (entity._mixer) entity._mixer.update(delta * 1.5);

        // Grazing timer
        if (entity._grazeTimer > 0) {
            entity._grazeTimer -= delta;
            entity.velocity.multiplyScalar(0.9);
        }

        // Fox: track nearest deer
        if (entity._type === 'fox') {
            for (const other of entities) {
                if (other._type !== 'deer') continue;
                const d = entity.position.distanceTo(other.position);
                if (d < nearestDeerDist) {
                    nearestDeerDist = d;
                    nearestDeerToFox = other;
                }
            }
            if (nearestDeerToFox && nearestDeerDist < 20) {
                entity._pursuitBehavior.evader = nearestDeerToFox;
                entity._pursuitBehavior.active = true;
            } else {
                entity._pursuitBehavior.active = false;
            }
        }

        // Deer: flee from fox
        if (entity._type === 'deer') {
            for (const other of entities) {
                if (other._type !== 'fox') continue;
                const d = entity.position.distanceTo(other.position);
                if (d < 12) {
                    const flee = entity.position.clone().sub(other.position).normalize();
                    const strength = 4.0 * (1 - d / 8);
                    entity.velocity.x += flee.x * strength;
                    entity.velocity.z += flee.z * strength;
                }
            }
        }
    }
}


// Hunter states (Yuka FSM)
class SneakState extends YUKA.State {
    enter(hunter) {
        showToast('🔫 A hunter appears!');
    }
    execute(hunter, delta) {
        // Walk toward the exit point (opposite edge), crossing the whole meadow
        const target = hunter._exitTarget;
        if (target) {
            const dx = target.x - hunter.position.x;
            const dz = target.z - hunter.position.z;
            const d = Math.sqrt(dx * dx + dz * dz);
            if (d > 2) {
                hunter.velocity.set((dx / d) * 1.5, 0, (dz / d) * 1.5);
            } else {
                // Reached the other side — just leave
                hunter.stateMachine.changeTo('gone');
                return;
            }
        }
        if (hunter._attackerCount > 0 || hunter._confidence < 0.7) {
            hunter.stateMachine.changeTo('panic');
        }
    }
}

class PanicState extends YUKA.State {
    enter(hunter) {
        showToast('😱 The animals attack! Hunter panics!');
    }
    execute(hunter, delta) {
        hunter._wobble += delta * 15;
        const mesh = hunter._renderMesh;
        if (!mesh) return;

        mesh.rotation.z = Math.sin(hunter._wobble) * 0.2;
        const mouth = mesh.getObjectByName('mouth');
        if (mouth) mouth.scale.setScalar(1 + (1 - hunter._confidence) * 2);
        const armL = mesh.getObjectByName('armL');
        const armR = mesh.getObjectByName('armR');
        if (armL) armL.rotation.z = 0.3 + Math.sin(hunter._wobble * 1.3) * 0.8;
        if (armR) armR.rotation.z = -0.3 + Math.cos(hunter._wobble * 1.5) * 0.8;
        const gun = mesh.getObjectByName('gun');
        if (gun && hunter._confidence < 0.4) gun.visible = false;

        // Flee away from animals
        hunter._fleeDir.set(0, 0, 0);
        for (const entity of hunter._entityManager.entities) {
            if (!entity._type) continue;
            const dx = hunter.position.x - entity.position.x;
            const dz = hunter.position.z - entity.position.z;
            const d = Math.sqrt(dx * dx + dz * dz);
            if (d < 10 && d > 0.1) {
                hunter._fleeDir.x += dx / (d * d);
                hunter._fleeDir.z += dz / (d * d);
            }
        }
        if (hunter._fleeDir.length() > 0.01) {
            hunter._fleeDir.normalize();
        } else {
            const pos = hunter.position;
            hunter._fleeDir.set(pos.x, 0, pos.z).normalize();
        }

        const speed = 3 + (1 - hunter._confidence) * 5;
        hunter.velocity.x += (hunter._fleeDir.x * speed - hunter.velocity.x) * delta * 3;
        hunter.velocity.z += (hunter._fleeDir.z * speed - hunter.velocity.z) * delta * 3;

        // Check if escaped
        const dist = Math.sqrt(hunter.position.x ** 2 + hunter.position.z ** 2);
        if ((hunter._confidence <= 0 && dist > BOUNDS) || dist > BOUNDS + 15) {
            hunter.stateMachine.changeTo('gone');
        }
    }
}

class GoneState extends YUKA.State {
    enter(hunter) {
        hunter.active = false;
        hunter._renderMesh.visible = false;
        // Reset mesh
        const gun = hunter._renderMesh.getObjectByName('gun');
        if (gun) gun.visible = true;
        const mouth = hunter._renderMesh.getObjectByName('mouth');
        if (mouth) mouth.scale.setScalar(1);
        hunter._renderMesh.rotation.z = 0;
        showToast('🏃 The hunter flees! The meadow is safe.');
    }
    execute() {}
}

function buildHunterMesh() {
    const g = new THREE.Group();
    const boot = new THREE.MeshBasicMaterial({ color: 0x3a2510 });
    const leg = new THREE.MeshBasicMaterial({ color: 0x8b7d5a });
    const vest = new THREE.MeshBasicMaterial({ color: 0x5a6b3a });
    const flannel = new THREE.MeshBasicMaterial({ color: 0xcc3333 });
    const skin = new THREE.MeshBasicMaterial({ color: 0xf0c090 });
    const hat = new THREE.MeshBasicMaterial({ color: 0xff6600 });
    const eye = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const pupil = new THREE.MeshBasicMaterial({ color: 0x111111 });
    const gunMat = new THREE.MeshBasicMaterial({ color: 0x4a3520 });
    const mouthMat = new THREE.MeshBasicMaterial({ color: 0x331111 });

    function addPart(geo, mat, x, y, z) {
        const m = new THREE.Mesh(geo, mat);
        m.position.set(x, y, z);
        g.add(m);
        return m;
    }

    // Boots
    addPart(new THREE.BoxGeometry(0.25, 0.2, 0.35), boot, -0.15, 0.1, 0.05);
    addPart(new THREE.BoxGeometry(0.25, 0.2, 0.35), boot, 0.15, 0.1, 0.05);
    // Legs
    addPart(new THREE.CylinderGeometry(0.08, 0.1, 0.6, 8), leg, -0.15, 0.5, 0);
    addPart(new THREE.CylinderGeometry(0.08, 0.1, 0.6, 8), leg, 0.15, 0.5, 0);
    // Body
    addPart(new THREE.BoxGeometry(0.5, 0.6, 0.3), vest, 0, 1.1, 0);
    addPart(new THREE.BoxGeometry(0.52, 0.15, 0.25), flannel, 0, 0.78, 0);
    // Arms
    const armL = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.07, 0.5, 8), leg);
    armL.position.set(-0.35, 1.05, 0); armL.rotation.z = 0.3; armL.name = 'armL'; g.add(armL);
    const armR = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.07, 0.5, 8), leg);
    armR.position.set(0.35, 1.05, 0); armR.rotation.z = -0.3; armR.name = 'armR'; g.add(armR);
    // Head
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.2, 12, 8), skin);
    head.position.set(0, 1.6, 0); head.name = 'head'; g.add(head);
    // Hat
    addPart(new THREE.CylinderGeometry(0.15, 0.25, 0.2, 12), hat, 0, 1.82, 0);
    addPart(new THREE.CylinderGeometry(0.3, 0.3, 0.04, 12), hat, 0, 1.72, 0);
    // Eyes
    addPart(new THREE.SphereGeometry(0.05, 8, 6), eye, -0.08, 1.63, 0.18);
    addPart(new THREE.SphereGeometry(0.05, 8, 6), eye, 0.08, 1.63, 0.18);
    addPart(new THREE.SphereGeometry(0.025, 6, 4), pupil, -0.08, 1.63, 0.22);
    addPart(new THREE.SphereGeometry(0.025, 6, 4), pupil, 0.08, 1.63, 0.22);
    // Gun
    const gun = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.03, 1.0, 6), gunMat);
    gun.position.set(0.4, 1.1, 0.15); gun.rotation.z = -0.6; gun.rotation.x = 0.2; gun.name = 'gun'; g.add(gun);
    // Mouth
    const mouth = new THREE.Mesh(new THREE.SphereGeometry(0.04, 8, 6), mouthMat);
    mouth.position.set(0, 1.53, 0.19); mouth.name = 'mouth'; g.add(mouth);

    g.visible = false;
    return g;
}

function createHunter(entityManager, scene) {
    const mesh = buildHunterMesh();
    scene.add(mesh);

    const hunter = new YUKA.Vehicle();
    hunter.active = false;
    hunter._type = 'hunter';
    hunter._renderMesh = mesh;
    hunter._entityManager = entityManager;
    hunter._confidence = 1.0;
    hunter._attackerCount = 0;
    hunter._wobble = 0;
    hunter._fleeDir = new YUKA.Vector3();

    hunter.setRenderComponent(mesh, (entity, renderMesh) => {
        renderMesh.position.set(entity.position.x, entity.position.y, entity.position.z);
        if (entity.velocity.length() > 0.1) {
            renderMesh.rotation.y = Math.atan2(entity.velocity.x, entity.velocity.z);
        }
    });

    // State machine
    hunter.stateMachine = new YUKA.StateMachine(hunter);
    hunter.stateMachine.add('sneak', new SneakState());
    hunter.stateMachine.add('panic', new PanicState());
    hunter.stateMachine.add('gone', new GoneState());

    entityManager.add(hunter);
    return hunter;
}

function spawnHunter(hunter) {
    const angle = rand(0, Math.PI * 2);
    const edge = BOUNDS + 3;
    hunter.position.set(Math.cos(angle) * edge, 0, Math.sin(angle) * edge);
    hunter.position.y = getHeight(hunter.position.x, hunter.position.z);
    // Exit target: opposite side of the meadow (cross the whole area)
    const exitAngle = angle + Math.PI + rand(-0.5, 0.5);
    hunter._exitTarget = { x: Math.cos(exitAngle) * edge, z: Math.sin(exitAngle) * edge };
    hunter.velocity.set(0, 0, 0);
    hunter._confidence = 1.0;
    hunter._attackerCount = 0;
    hunter._wobble = 0;
    hunter.active = true;
    hunter._renderMesh.visible = true;
    hunter.stateMachine.changeTo('sneak');
}

function updateHunter(hunter, entityManager, delta) {
    if (!hunter.active) return;

    const pos = hunter.position;
    pos.y = getHeight(pos.x, pos.z);

    // Count attackers + apply charge forces to animals
    hunter._attackerCount = 0;
    for (const entity of entityManager.entities) {
        if (!entity._type || entity._type === 'hunter' || entity._type === 'fox') continue;
        const dx = pos.x - entity.position.x;
        const dz = pos.z - entity.position.z;
        const d = Math.sqrt(dx * dx + dz * dz);
        if (d < 16) {
            const charge = 6 * (1 - d / 10);
            entity.velocity.x -= (dx / d) * charge * delta;
            entity.velocity.z -= (dz / d) * charge * delta;
        }
        if (d < 5) {
            hunter._attackerCount++;
            hunter._confidence -= delta * 0.4;
        }
    }

    // Run state machine
    hunter.stateMachine.update(delta);

    // Move
    pos.x += hunter.velocity.x * delta;
    pos.z += hunter.velocity.z * delta;
    pos.y = getHeight(pos.x, pos.z);

    hunter._renderMesh.position.y += Math.abs(Math.sin(hunter._wobble * 0.8)) * 0.05;
}


const STATES = {
    clear:       { ambient: 0x8899aa, sun: 0xffeedd, sunI: 0.5, ambI: 0.6, fog: null, wind: [0, 0] },
    cloudy:      { ambient: 0x778899, sun: 0xcccccc, sunI: 0.2, ambI: 0.7, fog: null, wind: 'light' },
    rain:        { ambient: 0x556677, sun: 0x889999, sunI: 0.1, ambI: 0.5, fog: 0x667788, wind: 'medium' },
    storm:       { ambient: 0x334455, sun: 0x556666, sunI: 0.05, ambI: 0.4, fog: 0x445566, wind: 'heavy' },
    fog:         { ambient: 0x99aabb, sun: 0xdddddd, sunI: 0.15, ambI: 0.8, fog: 0xbbcccc, wind: [0, 0] },
    golden_hour: { ambient: 0xcc8855, sun: 0xffaa44, sunI: 0.7, ambI: 0.5, fog: null, wind: [0, 0] },
};

const SKY_GRADIENTS = {
    clear:       [['#4488cc', 0], ['#7ab0dd', 0.4], ['#b8d8e8', 0.7], ['#d8e8d0', 1]],
    cloudy:      [['#5577aa', 0], ['#99aabb', 1]],
    rain:        [['#446688', 0], ['#667788', 1]],
    storm:       [['#223344', 0], ['#334455', 1]],
    fog:         [['#8899aa', 0], ['#aabbbb', 1]],
    golden_hour: [['#cc6633', 0], ['#dd9955', 0.5], ['#eebb77', 1]],
};

const EMOJIS = { clear: '☀️', cloudy: '☁️', rain: '🌧️', storm: '⛈️', fog: '🌫️', golden_hour: '🌅' };
const LABELS = { clear: 'Clear skies', cloudy: 'Clouds rolling in', rain: 'Rain begins to fall',
    storm: 'A storm approaches!', fog: 'Fog descends on the meadow', golden_hour: 'Golden hour' };

function createWeatherSystem(scene, ambientLight, sunLight, bgCtx) {
    // Rain particles
    const rainGeo = new THREE.BufferGeometry();
    const rainCount = 3000;
    const rainPos = new Float32Array(rainCount * 3);
    for (let i = 0; i < rainCount; i++) {
        rainPos[i * 3] = rand(-30, 30);
        rainPos[i * 3 + 1] = rand(0, 25);
        rainPos[i * 3 + 2] = rand(-30, 30);
    }
    rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
    const rainMat = new THREE.PointsMaterial({ color: 0xaaccee, size: 0.08, transparent: true, opacity: 0 });
    const rain = new THREE.Points(rainGeo, rainMat);
    scene.add(rain);

    // Lightning
    const lightning = new THREE.PointLight(0xffffff, 0, 100);
    lightning.position.set(0, 30, 0);
    scene.add(lightning);

    const state = {
        current: 'clear',
        windX: 0, windZ: 0,
        _lightningTimer: 0,
    };

    function setWeather(name) {
        state.current = name;
        const cfg = STATES[name];
        const wind = cfg.wind === 'light' ? [rand(-0.3, 0.3), rand(-0.3, 0.3)]
            : cfg.wind === 'medium' ? [rand(-0.8, 0.8), rand(-0.8, 0.8)]
            : cfg.wind === 'heavy' ? [rand(-2, 2), rand(-2, 2)]
            : cfg.wind;
        state.windX = wind[0]; state.windZ = wind[1];
        showToast(`${EMOJIS[name]} ${LABELS[name]}`);
    }

    function update(delta) {
        const cfg = STATES[state.current];
        const targetAmbient = new THREE.Color(cfg.ambient);
        const targetSun = new THREE.Color(cfg.sun);

        ambientLight.color.lerp(targetAmbient, delta * 0.5);
        ambientLight.intensity += (cfg.ambI - ambientLight.intensity) * delta * 0.5;
        sunLight.color.lerp(targetSun, delta * 0.5);
        sunLight.intensity += (cfg.sunI - sunLight.intensity) * delta * 0.5;

        // Fog
        if (cfg.fog) {
            const fogColor = new THREE.Color(cfg.fog);
            if (!scene.fog) scene.fog = new THREE.Fog(fogColor, 15, 50);
            scene.fog.color.lerp(fogColor, delta * 0.3);
            const targetFar = state.current === 'fog' ? 30 : state.current === 'storm' ? 35 : 50;
            scene.fog.far += (targetFar - scene.fog.far) * delta * 0.3;
        } else if (scene.fog) {
            scene.fog.far += (200 - scene.fog.far) * delta * 0.3;
            if (scene.fog.far > 180) scene.fog = null;
        }

        // Rain
        const isRaining = state.current === 'rain' || state.current === 'storm';
        const targetOp = isRaining ? (state.current === 'storm' ? 0.7 : 0.4) : 0;
        rainMat.opacity += (targetOp - rainMat.opacity) * delta * 0.5;

        if (rainMat.opacity > 0.01) {
            const positions = rainGeo.attributes.position;
            const speed = state.current === 'storm' ? 40 : 20;
            for (let i = 0; i < rainCount; i++) {
                positions.array[i * 3 + 1] -= delta * speed;
                positions.array[i * 3] += state.windX * delta * 3;
                positions.array[i * 3 + 2] += state.windZ * delta * 3;
                if (positions.array[i * 3 + 1] < 0) {
                    positions.array[i * 3] = rand(-30, 30);
                    positions.array[i * 3 + 1] = rand(15, 25);
                    positions.array[i * 3 + 2] = rand(-30, 30);
                }
            }
            positions.needsUpdate = true;
        }

        // Lightning
        if (state.current === 'storm') {
            state._lightningTimer -= delta;
            if (state._lightningTimer <= 0) {
                lightning.intensity = rand(3, 8);
                lightning.position.set(rand(-15, 15), 25, rand(-15, 15));
                state._lightningTimer = rand(1, 6);
                setTimeout(() => { lightning.intensity = 0; }, 100);
            }
        } else {
            lightning.intensity = 0;
        }

        // Sky
        const stops = SKY_GRADIENTS[state.current];
        const skyGrad = bgCtx.createLinearGradient(0, 0, 0, 512);
        for (const [color, pos] of stops) skyGrad.addColorStop(pos, color);
        bgCtx.fillStyle = skyGrad;
        bgCtx.fillRect(0, 0, 2, 512);
        scene.background.needsUpdate = true;
    }

    return { state, setWeather, update };
}


const EVENT_MIN = 8;
const EVENT_MAX = 20;

function createEventSystem(entityManager, weatherSystem, hunter) {
    let timer = 5;

    function trigger() {
        const pool = ['weather', 'stampede', 'grazing_halt', 'fox_frenzy', 'scatter'];
        if (!hunter.active) pool.push('hunter', 'hunter'); // double weight

        const type = pool[Math.floor(rand(0, pool.length))];
        const entities = entityManager.entities;

        switch (type) {
            case 'weather': {
                const options = ['clear', 'cloudy', 'rain', 'storm', 'fog', 'golden_hour']
                    .filter(w => w !== weatherSystem.state.current);
                weatherSystem.setWeather(options[Math.floor(rand(0, options.length))]);
                break;
            }
            case 'stampede': {
                const angle = rand(0, Math.PI * 2);
                for (const e of entities) {
                    if (e._type === 'deer') {
                        e.velocity.x = Math.cos(angle) * e.maxSpeed * 1.5;
                        e.velocity.z = Math.sin(angle) * e.maxSpeed * 1.5;
                    }
                }
                showToast('🦌 The herd stampedes!');
                break;
            }
            case 'grazing_halt': {
                for (const e of entities) {
                    if (e._type === 'deer') {
                        e.velocity.multiplyScalar(0.05);
                        e._grazeTimer = rand(3, 6);
                    }
                }
                showToast('🌿 The herd stops to graze');
                break;
            }
            case 'fox_frenzy': {
                for (const e of entities) {
                    if (e._type === 'fox') {
                        const original = e.maxSpeed;
                        e.maxSpeed *= 2;
                        setTimeout(() => { e.maxSpeed = original; }, 4000);
                    }
                }
                showToast('🦊 The fox charges!');
                break;
            }
            case 'scatter': {
                for (const e of entities) {
                    if (!e._type || e._type === 'hunter') continue;
                    const d = Math.sqrt(e.position.x ** 2 + e.position.z ** 2) || 1;
                    e.velocity.x = (e.position.x / d) * e.maxSpeed * 1.5;
                    e.velocity.z = (e.position.z / d) * e.maxSpeed * 1.5;
                }
                showToast('💨 Something spooks the animals!');
                break;
            }
            case 'hunter': {
                spawnHunter(hunter);
                break;
            }
        }
    }

    function update(rawDelta) {
        timer -= rawDelta;
        if (timer <= 0) {
            trigger();
            timer = rand(EVENT_MIN, EVENT_MAX);
        }
    }

    return { update };
}

function loadAllNature(loader, scene, obstacles) {
    for (const asset of NATURE_ASSETS) {
        loader.load(asset.url, (gltf) => {
            for (let i = 0; i < asset.count; i++) {
                let x, z;
                if (asset.ring) {
                    const angle = (i / asset.count) * Math.PI * 2 + (asset.offset || 0);
                    const r = rand(asset.rMin, asset.rMax);
                    x = Math.cos(angle) * r;
                    z = Math.sin(angle) * r;
                } else {
                    x = rand(asset.xMin, asset.xMax);
                    z = rand(asset.zMin, asset.zMax);
                }
                const y = getHeight(x, z);
                const model = gltf.scene.clone();
                model.position.set(x, y, z);
                model.rotation.y = rand(0, Math.PI * 2);
                model.scale.setScalar(rand(asset.sMin, asset.sMax));
                convertToBasicMaterials(model, 0x55aa33);
                scene.add(model);

                if (asset.collision) {
                    obstacles.push({ position: new THREE.Vector3(x, y, z), radius: asset.collision });
                }
            }
        });
    }
}


const WALK_SPEED = 3.0;
const RUN_SPEED = 7.0;
const JUMP_VELOCITY = 8.0;
const GRAVITY = -20;
const TURN_SPEED = 4.0;
const CAM_HEIGHT = 4;
const CAM_DISTANCE = 8;

function createPlayerController(camera, controls, entityManager) {
    const state = {
        active: false,
        entity: null,       // possessed Yuka entity
        mesh: null,         // Three.js mesh
        running: false,
        jumping: false,
        verticalVel: 0,
        input: { forward: false, backward: false, left: false, right: false, jump: false },
        heading: 0,
    };

    // Raycaster for click-to-possess
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    function possess(entity) {
        if (!entity || !entity._type) return;
        state.entity = entity;
        state.mesh = entity._renderComponent?.mesh || entity._renderMesh;
        // Find the Three.js mesh from the render component
        for (const child of entity._renderComponent ? [] : []) { /* noop */ }
        // The mesh is set via setRenderComponent — grab it
        if (!state.mesh) {
            // Walk the scene to find it by matching position
            entityManager.entities.forEach(e => {
                if (e === entity && e._mixer?._root) {
                    state.mesh = e._mixer._root;
                }
            });
        }

        state.active = true;
        state.running = false;
        state.jumping = false;
        state.verticalVel = 0;
        state.heading = entity.rotation?.y || Math.atan2(entity.velocity.x, entity.velocity.z);

        // Disable AI steering while player controls
        entity._playerControlled = true;
        entity.steering?.behaviors?.forEach(b => { b.active = false; });

        // Switch to walk/gallop animation
        switchAnimation(entity, state.running ? 'Gallop' : 'Walk');

        controls.enabled = false;
        showToast(`🎮 Controlling ${entity._type}! Tap buttons to move.`);
        document.getElementById('player-controls').style.display = 'flex';
        document.getElementById('player-side-controls').style.display = 'flex';
        document.getElementById('btn-exit-animal').style.display = 'block';
    }

    function release() {
        if (!state.entity) return;
        const entity = state.entity;

        // Re-enable AI
        entity._playerControlled = false;
        entity.steering?.behaviors?.forEach(b => { b.active = true; });
        switchAnimation(entity, 'Walk');

        state.active = false;
        state.entity = null;
        state.mesh = null;
        state.input = { forward: false, backward: false, left: false, right: false, jump: false };

        controls.enabled = true;
        document.getElementById('player-controls').style.display = 'none';
        document.getElementById('player-side-controls').style.display = 'none';
        document.getElementById('btn-exit-animal').style.display = 'none';
        showToast('Released animal');
    }

    function switchAnimation(entity, name) {
        if (!entity._mixer || !entity._mixer._root) return;
        const mixer = entity._mixer;
        // Stop all current actions
        mixer.stopAllAction();
        // Find and play the target clip
        const animations = entity._animations || [];
        const clip = animations.find(a => a.name.includes(name));
        if (clip) {
            const action = mixer.clipAction(clip);
            action.timeScale = name === 'Gallop' ? 1.8 : 1.5;
            action.play();
        }
    }

    function update(delta) {
        if (!state.active || !state.entity) return;
        const entity = state.entity;
        const pos = entity.position;
        const inp = state.input;

        // Turn
        if (inp.left) state.heading += TURN_SPEED * delta;
        if (inp.right) state.heading -= TURN_SPEED * delta;

        // Move forward/backward
        const speed = state.running ? RUN_SPEED : WALK_SPEED;
        let moveX = 0, moveZ = 0;
        if (inp.forward) {
            moveX = Math.sin(state.heading) * speed;
            moveZ = Math.cos(state.heading) * speed;
        }
        if (inp.backward) {
            moveX = -Math.sin(state.heading) * speed * 0.5;
            moveZ = -Math.cos(state.heading) * speed * 0.5;
        }

        // Apply movement
        entity.velocity.x = moveX;
        entity.velocity.z = moveZ;
        pos.x += moveX * delta;
        pos.z += moveZ * delta;

        // Jump / gravity
        const groundY = getHeight(pos.x, pos.z);
        if (inp.jump && !state.jumping) {
            state.jumping = true;
            state.verticalVel = JUMP_VELOCITY;
            inp.jump = false;
        }
        if (state.jumping) {
            state.verticalVel += GRAVITY * delta;
            pos.y += state.verticalVel * delta;
            if (pos.y <= groundY) {
                pos.y = groundY;
                state.jumping = false;
                state.verticalVel = 0;
            }
        } else {
            pos.y = groundY;
        }

        // Rotation
        if (state.mesh) {
            state.mesh.rotation.y = state.heading;
        }
        // Also set on entity for Yuka sync
        entity.rotation = entity.rotation || {};

        // Third-person camera
        const camX = pos.x - Math.sin(state.heading) * CAM_DISTANCE;
        const camZ = pos.z - Math.cos(state.heading) * CAM_DISTANCE;
        const camY = pos.y + CAM_HEIGHT;
        camera.position.lerp(new THREE.Vector3(camX, camY, camZ), delta * 3);
        camera.lookAt(pos.x, pos.y + 1.5, pos.z);

        // Update animation mixer
        if (entity._mixer) entity._mixer.update(delta * 1.5);
    }

    // Click handler for possessing animals
    function onPointerDown(event) {
        if (state.active) return;
        const rect = event.target.getBoundingClientRect();
        mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);

        // Collect all animal meshes
        const meshes = [];
        for (const entity of entityManager.entities) {
            if (entity._type === 'deer' || entity._type === 'fox') {
                if (entity._mixer?._root) {
                    entity._mixer._root.traverse(child => {
                        if (child.isMesh) {
                            child._yukaEntity = entity;
                            meshes.push(child);
                        }
                    });
                }
            }
        }

        const hits = raycaster.intersectObjects(meshes, false);
        if (hits.length > 0) {
            const entity = hits[0].object._yukaEntity;
            if (entity) possess(entity);
        }
    }

    return { state, possess, release, update, onPointerDown };
}

    createDeer(entityManager, scene, loader, huskyGltf, { x: 0, z: 10 });
});

// ─── Game Loop ───
const clock = new THREE.Clock();
let autoOrbit = true;
let speedMultiplier = 1.5;

function animate() {
    requestAnimationFrame(animate);
    const rawDelta = clock.getDelta();
    const delta = rawDelta * speedMultiplier;

    // Yuka entity updates (steering behaviors)
    entityManager.update(delta);

    // Terrain following, boundary forces, fox targeting
    updateAnimals(entityManager, delta);

    // Wind on animals
    for (const entity of entityManager.entities) {
        if (entity._type && entity._type !== 'hunter') {
            entity.velocity.x += weatherSystem.state.windX * 0.3 * delta;
            entity.velocity.z += weatherSystem.state.windZ * 0.3 * delta;
        }
    }

    // Hunter
    updateHunter(hunter, entityManager, delta);

    // Player control
    player.update(delta);

    // Weather + events
    weatherSystem.update(delta);
    eventSystem.update(rawDelta);

    // Camera orbit follows terrain (only when not controlling an animal)
    if (autoOrbit && !player.state.active) {
        const t = clock.elapsedTime * 0.12;
        const cx = Math.cos(t) * 25;
        const cz = Math.sin(t) * 25;
        camera.position.set(cx, getHeight(cx, cz) + 10 + Math.sin(t * 0.5) * 3, cz);
        controls.target.set(0, 2, 0);
    }

    controls.update();
    renderer.render(scene, camera);
}
animate();

// ─── UI ───
document.getElementById('btn-spin').addEventListener('click', (e) => {
    autoOrbit = !autoOrbit;
    e.target.classList.toggle('active', autoOrbit);
});

const speeds = [1.5, 2.5, 1, 0.5];
let speedIdx = 0;
document.getElementById('btn-speed').addEventListener('click', (e) => {
    speedIdx = (speedIdx + 1) % speeds.length;
    speedMultiplier = speeds[speedIdx];
    e.target.textContent = `Speed: ${speedMultiplier}x`;
});

// Player control buttons
document.getElementById('btn-exit-animal')?.addEventListener('click', () => player.release());

// Touch/click directional buttons
for (const [id, key] of [['btn-up','forward'],['btn-down','backward'],['btn-left','left'],['btn-right','right']]) {
    const el = document.getElementById(id);
    if (!el) continue;
    const setInput = (val) => { player.state.input[key] = val; };
    el.addEventListener('pointerdown', (e) => { e.preventDefault(); setInput(true); });
    el.addEventListener('pointerup', () => setInput(false));
    el.addEventListener('pointerleave', () => setInput(false));
}
document.getElementById('btn-jump')?.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    player.state.input.jump = true;
});
document.getElementById('btn-run')?.addEventListener('click', (e) => {
    player.state.running = !player.state.running;
    e.target.classList.toggle('active', player.state.running);
    e.target.textContent = player.state.running ? '🏃 Run' : '🚶 Walk';
    // Switch animation
    if (player.state.entity?._mixer) {
        const name = player.state.running ? 'Gallop' : 'Walk';
        const mixer = player.state.entity._mixer;
        mixer.stopAllAction();
        const clip = player.state.entity._animations?.find(a => a.name.includes(name));
        if (clip) {
            const action = mixer.clipAction(clip);
            action.timeScale = player.state.running ? 1.8 : 1.5;
            action.play();
        }
    }
});

// Keyboard controls (for desktop)
window.addEventListener('keydown', (e) => {
    if (!player.state.active) return;
    if (e.key === 'w' || e.key === 'ArrowUp') player.state.input.forward = true;
    if (e.key === 's' || e.key === 'ArrowDown') player.state.input.backward = true;
    if (e.key === 'a' || e.key === 'ArrowLeft') player.state.input.left = true;
    if (e.key === 'd' || e.key === 'ArrowRight') player.state.input.right = true;
    if (e.key === ' ') player.state.input.jump = true;
    if (e.key === 'Shift') {
        player.state.running = true;
        document.getElementById('btn-run')?.classList.add('active');
    }
    if (e.key === 'Escape') player.release();
});
window.addEventListener('keyup', (e) => {
    if (e.key === 'w' || e.key === 'ArrowUp') player.state.input.forward = false;
    if (e.key === 's' || e.key === 'ArrowDown') player.state.input.backward = false;
    if (e.key === 'a' || e.key === 'ArrowLeft') player.state.input.left = false;
    if (e.key === 'd' || e.key === 'ArrowRight') player.state.input.right = false;
    if (e.key === 'Shift') {
        player.state.running = false;
        const btn = document.getElementById('btn-run');
        if (btn) { btn.classList.remove('active'); btn.textContent = '🚶 Walk'; }
    }
});

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// Build number
const buildEl = document.getElementById('build-number');
if (buildEl) buildEl.textContent = `Build ${BUILD}`;

setTimeout(() => {
    const info = document.getElementById('info');
    if (info) info.style.opacity = '0';
}, 5000);

</script>
</body>
</html>
